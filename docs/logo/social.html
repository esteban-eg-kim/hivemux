<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&family=JetBrains+Mono:wght@600&display=swap" rel="stylesheet">
<style>
html,body{margin:0;width:1280px;height:640px;overflow:hidden}
body{background:radial-gradient(900px 500px at 85% 20%,#1d2a3f 0%,#16181d 60%);font-family:'IBM Plex Sans',sans-serif;color:#e1e6f0;display:flex;align-items:center;gap:40px;padding:0 0 0 72px;box-sizing:border-box}
.l{flex:0 0 470px;display:flex;flex-direction:column;gap:22px}
.brand{display:flex;align-items:center;gap:20px}
.brand img{width:96px;height:96px}
.brand span{font-family:'JetBrains Mono',monospace;font-weight:600;font-size:64px;letter-spacing:-1px}
h1{margin:0;font-size:44px;line-height:1.15;font-weight:700}
p{margin:0;font-size:22px;line-height:1.45;color:#a9b2c3}
.tags{display:flex;gap:10px;font-family:'JetBrains Mono',monospace;font-size:16px}
.tags b{font-weight:600;padding:6px 12px;border-radius:999px;background:#262b36}
.tags .r{color:#5aa9ff}.tags .w{color:#f5a524}.tags .d{color:#3ecf8e}
.shot{flex:1;height:100%;position:relative}
.shot img{position:absolute;left:0;top:50%;transform:translateY(-50%);width:820px;border-radius:14px;box-shadow:0 30px 80px rgba(0,0,0,.55),0 0 0 1px #2f3644}
</style></head><body>
<div class="l">
 <div class="brand"><img src="hivemux-logo.svg"><span>hivemux</span></div>
 <h1>Know which Claude needs you.</h1>
 <p>A tmux sidebar for every Claude Code session: running, waiting for you, or done.</p>
 <div class="tags"><b class="r">◐ running</b><b class="w">● waiting</b><b class="d">✓ done</b></div>
</div>
<div class="shot"><img src="../preview-en.png"></div>
</body></html>
