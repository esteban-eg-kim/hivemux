# Ghostty settings hivemux setup adds to ~/.config/ghostty/config (between
# "# >>> hivemux >>>" markers). Shown here for reference.

# every Ghostty window/tab attaches to tmux, so closing Ghostty never kills work
command = /path/to/hivemux/bin/hivemux-attach
# Option+1..9, Option+0, Option+O and Claude Code's Option shortcuts
macos-option-as-alt = true
window-save-state = always
confirm-close-surface = false

# optional: a font with good Korean/CJK width
# font-family = "D2Coding"
# font-size = 15
