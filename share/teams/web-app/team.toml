# A hivemux team template: this folder (team.toml + roles/) is the whole template, so it can be shared as is.
# hivemux 팀 템플릿: 이 폴더 (team.toml + roles/) 가 템플릿 전부라 그대로 나눌 수 있다.
id = "web-app"
name = "웹·앱 서비스 팀"
name_en = "Web & app service team"
description = "조사부터 출시까지, 웹과 앱 서비스를 만드는 6명 팀"
description_en = "Six roles that take a web or app service from research to launch"
author = "hivemux"
version = 1
flow = ["researcher", "planner", "designer", "dev", "qa", "marketer"]
# goals to start from, shown on the team page / 팀 화면에 보이는 시작 목표 예시
starters = ["로그인과 장바구니, 결제가 있는 쇼핑몰 MVP 를 만들자", "지금 서비스의 회원가입 흐름에서 이탈이 많다. 원인을 찾고 고치자", "경쟁 서비스와 비교해서 다음 분기에 만들 기능 3개를 정하고 첫 번째를 만들자"]
starters_en = ["Build a shop MVP with sign-in, a cart and checkout", "Many people drop out of our sign-up flow: find out why and fix it", "Compare us with competitors, pick three features for next quarter and build the first"]

# a role past this many thousand tokens of context, at rest, starts fresh from its notes
# 컨텍스트가 이 천 토큰을 넘고 쉬면 노트를 남기고 새로 시작한다
[diet]
at = 120
how = "renew"

[[role]]
id = "researcher"
name = "조사"
name_en = "Research"
model = "sonnet"
effort = "medium"
prompt = "roles/researcher.md"
owns = "docs/research/"

[[role]]
id = "planner"
name = "기획"
name_en = "Planning"
model = "opus"
effort = "high"
prompt = "roles/planner.md"
owns = "docs/spec/, docs/board.md"
lead = true

[[role]]
id = "designer"
name = "디자인"
name_en = "Design"
model = "sonnet"
effort = "high"
prompt = "roles/designer.md"
owns = "docs/design/"

[[role]]
id = "dev"
name = "개발"
name_en = "Dev"
model = "opus"
effort = "high"
prompt = "roles/dev.md"
owns = "its own worktree"
worktree = true
diet = { at = 160 }

[[role]]
id = "qa"
name = "QA"
name_en = "QA"
model = "sonnet"
effort = "high"
prompt = "roles/qa.md"
readonly = true

[[role]]
id = "marketer"
name = "마케팅"
name_en = "Marketing"
model = "sonnet"
effort = "medium"
prompt = "roles/marketer.md"
owns = "docs/marketing/"
