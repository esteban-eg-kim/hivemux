<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>hivemux office 3D</title>
<link rel="icon" href="/logo.svg" type="image/svg+xml">
<style>
/* The bee office in 3D (a trial: three.js, served from share/office/vendor). The same /state as the 2D office;
   this page only draws it. ?q=low: no shadows, 1x pixels. Stats at the top right, for measuring.
   3D 벌 사무실 (시험판: three.js, share/office/vendor 에서). 2D 사무실과 같은 /state 를 그리기만 한다.
   ?q=low: 그림자 없음, 1배 화소. 오른쪽 위 숫자는 측정용. */
:root { --fg: #1b1f27; --muted: #5a6375; --panel: rgba(255, 255, 255, .86); --line: #d3d9e3; --run: #2f7fd6; --wait: #c77d00; --done: #1d9a64; --sleep: #8b94a5;
  --f-body: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", sans-serif; --f-mono: ui-monospace, "SF Mono", Menlo, monospace; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; background: #cfe3f2; color: var(--fg); font: 13px/1.4 var(--f-body); }
canvas#view { position: fixed; inset: 0; width: 100%; height: 100%; display: block; cursor: grab; }
canvas#view.drag { cursor: grabbing; }
.bar { position: fixed; top: 12px; display: flex; align-items: center; gap: 10px; background: var(--panel); border: 1px solid var(--line);
  border-radius: 12px; padding: 6px 10px; box-shadow: 0 4px 16px rgba(0,0,0,.1); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); z-index: 5; }
.bar.l { left: 12px; } .bar.r { right: 12px; font: 12px var(--f-mono); color: var(--muted); }
.brand { display: flex; align-items: center; gap: 8px; font: 600 15px var(--f-mono); }
.pill { font-size: 12px; font-weight: 700; background: #fbefd2; color: #7a4d00; border-radius: 999px; padding: 2px 9px; }
a.btn { text-decoration: none; color: var(--fg); border: 1px solid var(--line); background: #fff; border-radius: 8px; padding: 5px 10px; font-weight: 600; }
#tags { position: fixed; inset: 0; pointer-events: none; z-index: 3; }
.tag { position: absolute; transform: translate(-50%, -100%); white-space: nowrap; background: rgba(255,255,255,.94); border-radius: 999px; padding: 2px 9px 2px 7px;
  font-weight: 600; font-size: 12px; box-shadow: 0 1px 4px rgba(0,0,0,.12); display: flex; align-items: center; gap: 5px; }
.tag i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
.tag.say { background: #fff; border: 1px solid var(--line); font-weight: 500; }
.hint { position: fixed; left: 12px; bottom: 12px; background: var(--panel); border-radius: 10px; padding: 6px 10px; color: var(--muted); z-index: 5; }
</style>
<script type="importmap">{ "imports": { "three": "/vendor/three.module.min.js", "three/addons/": "/vendor/addons/" } }</script>
</head>
<body>
<canvas id="view"></canvas>
<div id="tags"></div>
<div class="bar l"><span class="brand"><img src="/logo.svg" alt="" width="22" height="22">hivemux</span><span class="pill">3D 시험판</span><a class="btn" href="/">2D 로</a></div>
<div class="bar r" id="stats">…</div>
<div class="hint" id="hint">끌기: 돌리기 · Shift+끌기: 옮기기 · 휠: 확대 · 벌 누르기: 그 세션으로</div>
<script type="module">
import * as THREE from 'three';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

const $ = s => document.querySelector(s);
const Q = new URLSearchParams(location.search).get('q') || 'mid';      // low | mid | high
const LOW = Q === 'low';
// for measuring: switch parts off (?env=0&shadow=0&dpr=1&bees=0) / 측정용: 부분을 끈다
const OFF = Object.fromEntries([...new URLSearchParams(location.search)].filter(([, v]) => v === '0').map(([k]) => [k, true]));
const DPR = Number(new URLSearchParams(location.search).get('dpr')) || 0;
let L = 'ko';
const tr = (ko, en) => L === 'ko' ? ko : en;
const PX = .045;                     // the 2D office's pixel heights to world units / 2D 사무실의 픽셀 높이를 월드 단위로

// ── renderer, light / 렌더러, 빛 ─────────────────────────────────────────────────────────────────
const canvas = $('#view');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: !LOW, powerPreference: 'low-power' });
renderer.setPixelRatio(DPR || (LOW ? 1 : Math.min(devicePixelRatio, Q === 'high' ? 2 : 1.5)));
renderer.toneMapping = THREE.NeutralToneMapping;
renderer.toneMappingExposure = .95;
renderer.shadowMap.enabled = !LOW && !OFF.shadow;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const scene = new THREE.Scene();
scene.background = new THREE.Color('#cfe3f2');
const pmrem = new THREE.PMREMGenerator(renderer);
if (!OFF.env) scene.environment = pmrem.fromScene(new RoomEnvironment(), .04).texture;
const camera = new THREE.PerspectiveCamera(30, 1, .5, 400);
const hemi = new THREE.HemisphereLight(0xfff6e6, 0xc9a882, .8);
const sun = new THREE.DirectionalLight(0xfff0d8, 2.2);
sun.castShadow = !LOW && !OFF.shadow;
sun.shadow.mapSize.set(Q === 'high' ? 2048 : 1536, Q === 'high' ? 2048 : 1536);
sun.shadow.bias = -.0005; sun.shadow.normalBias = .02;
scene.add(hemi, sun, sun.target);

// ── shapes (as in ohmyhome: rounded boxes, cylinders, balls; caches) / 도형 (ohmyhome 처럼, 캐시) ─────────
const mats = new Map(), geos = new Map();
function mat(color, o = {}) {
  const k = `${color}|${o.op ?? 1}|${o.em ?? ''}|${o.rough ?? .75}`;
  if (!mats.has(k)) mats.set(k, new THREE.MeshStandardMaterial({ color, roughness: o.rough ?? .75, metalness: 0, transparent: (o.op ?? 1) < 1,
    opacity: o.op ?? 1, emissive: o.em || 0x000000, emissiveIntensity: o.em ? 1 : 0, depthWrite: (o.op ?? 1) >= 1 }));
  return mats.get(k);
}
const geo = (k, make) => { if (!geos.has(k)) geos.set(k, make()); return geos.get(k); };
function mesh(g, gm, color, x, y, z, o = {}) {
  const m = new THREE.Mesh(gm, o.material || mat(color, o));
  m.position.set(x, y, z); m.castShadow = o.shadow !== false; m.receiveShadow = true;
  if (o.rot) m.rotation.set(...o.rot);
  if (o.scale) m.scale.set(...o.scale);
  g.add(m); return m;
}
// y is the bottom for boxes and cylinders, the middle for balls / 상자와 원기둥은 y 가 밑면, 공은 가운데
function rbox(g, w, h, d, x, y, z, color, o = {}) {
  const r = Math.min(o.r ?? .04, Math.min(w, h, d) / 2 - .001);
  return mesh(g, geo(`b${w},${h},${d},${r}`, () => new RoundedBoxGeometry(w, h, d, 2, r)), color, x, y + h / 2, z, o);
}
function cyl(g, rt, rb, h, x, y, z, color, o = {}) {
  return mesh(g, geo(`c${rt},${rb},${h},${o.seg ?? 20}`, () => new THREE.CylinderGeometry(rt, rb, h, o.seg ?? 20)), color, x, y + h / 2, z, o);
}
function ball(g, r, x, y, z, color, o = {}) { return mesh(g, geo(`s${r}`, () => new THREE.SphereGeometry(r, 20, 14)), color, x, y, z, o); }
function canvasTex(w, h, draw) {
  const c = document.createElement('canvas'); c.width = w; c.height = h; draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 4; return t;
}
// the floor, walls and furniture never move: one mesh per material (fewer draw calls)
// 바닥, 벽, 가구는 움직이지 않는다: 재질마다 메시 하나로 (그리기 횟수를 줄인다)
function mergeStatic(group) {
  group.updateMatrixWorld(true);
  const inv = group.matrixWorld.clone().invert(), buckets = new Map(), all = [];
  group.traverse(o => { if (o.isMesh && !o.userData.keep) all.push(o); });
  for (const m of all) {
    let g = m.geometry.index ? m.geometry.toNonIndexed() : m.geometry.clone();
    for (const a of Object.keys(g.attributes)) if (!['position', 'normal', 'uv'].includes(a)) g.deleteAttribute(a);
    g.applyMatrix4(new THREE.Matrix4().multiplyMatrices(inv, m.matrixWorld));
    const k = m.material.uuid + (m.castShadow ? 's' : '');
    if (!buckets.has(k)) buckets.set(k, { material: m.material, cast: m.castShadow, geos: [] });
    buckets.get(k).geos.push(g);
    m.parent.remove(m);
  }
  for (const b of buckets.values()) {
    const merged = new THREE.Mesh(mergeGeometries(b.geos), b.material);
    merged.castShadow = b.cast; merged.receiveShadow = true; merged.userData.merged = true; group.add(merged);
  }
}

// ── the office (the 2D office's floor plan, in tiles) / 사무실 (2D 사무실의 평면, 타일 단위) ───────────
const GX = 26, ROOM_Y = 6, WALL = 2.6;
const C = { floor: '#efe6d6', lounge: '#f3f5f8', tile: '#e3e7ee', wall: '#f4efe6', wallEdge: '#3b4250', desk: '#c99c6a', deskEdge: '#9c7448', chair: '#4a5160',
  sofa: '#5a7bb5', meet: '#d5e1ef', boss: '#ece5d6', grass: '#d9ead2', counter: '#8a6a4a', plant: '#4caf6e', pot: '#b56a45', honey: '#f2b632', mon: '#2a2e37' };
const POD_ROW = 2, DESK_W = 2.4, DESK_D = .9;
const podAt = i => ({ x: 1.3 + (i % POD_ROW) * 7.2, y: .7 + Math.floor(i / POD_ROW) * 4.2 });
let LAY = null, world = null;
const MEET_C = { x: 19, y: 3.1 };
const MEET_CHAIRS = Array.from({ length: 6 }, (_, i) => { const a = -Math.PI / 2 + i * Math.PI / 3; return { x: MEET_C.x + Math.cos(a) * 1.75, y: MEET_C.y + Math.sin(a) * 1.75 }; });
const qSpot = i => i < 6 ? { x: 24.3 + (i % 2) * .8, y: 3.75 + Math.floor(i / 2) * .65 } : { x: 22.6 - ((i - 6) % 4) * .7, y: 6.9 + Math.floor((i - 6) / 4) * .7 };
const SPOT_DEF = [['sofa', 8.6, 11.85, 1], ['sofa', 9.8, 11.85, 1], ['sofa', 11, 11.85, 1], ['sofa', 12.2, 11.85, 1], ['coffee', 1.95, 10.6, 1], ['coffee', 1.95, 11.8, 1],
  ['coffee', 1.95, 13, 1], ['chat', 3.2, 11, 1], ['chat', 4.8, 11, 1], ['idle', 3.2, 13.5, 1], ['idle', 4.8, 13.5, 1], ['idle', 13.9, 14.2, 1], ['idle', 6.4, 14.4, 1],
  ['pong', 15.75, 10.4, 0], ['pong', 19.45, 10.4, 0], ['plant', 22.3, 8.9, 0], ['plant', 24.4, 11.4, 0], ['idle', 21.8, 12.9, 0], ['idle', 23.4, 13.6, 0], ['idle', 25, 14.3, 0]];

function layout(sessions) {
  const work = sessions.filter(s => s.state !== 'idle').length;
  const pods = Math.max(1, Math.ceil(work / 4)), rows = Math.max(2, Math.ceil(pods / POD_ROW)), LOFF = (rows - 2) * 4.2;
  const desks = [];
  for (let i = 0; i < pods; i++) {
    const p = podAt(i);
    for (let k = 0; k < 4; k++) {
      const far = k < 2, x = p.x + 1.5 + (k % 2) * 2.6;
      desks.push({ id: `${i}:${k}`, far, x, y: far ? p.y + 1.05 : p.y + 1.95, seat: { x, y: far ? p.y + .3 : p.y + 2.7 } });
    }
  }
  return { pods, rows, LOFF, GY: 15.4 + LOFF, desks, spots: SPOT_DEF.map(([kind, x, y, sh]) => ({ kind, x, y: y + (sh ? LOFF : 0) })), sig: `${pods}` };
}

// world (x, z) is the tile (x, y); up is y / 월드 (x, z) 는 타일 (x, y), 위는 y
function plant(g, x, z, s = 1) {
  cyl(g, .2 * s, .16 * s, .42 * s, x, 0, z, C.pot);
  for (const [dx, dy, dz, r] of [[-.12, .62, 0, .2], [.12, .66, .05, .18], [0, .8, -.04, .2], [0, .56, .12, .19]]) ball(g, r * s, x + dx * s, dy * s, z + dz * s, C.plant);
}
function chair(g, x, z, back, col = C.chair, tall = 0) {    // back: [dx, dz] / 등받이 방향
  for (let i = 0; i < 5; i++) { const a = i * 2 * Math.PI / 5; rbox(g, .04, .03, .22, x + Math.sin(a) * .1, .03, z + Math.cos(a) * .1, '#3a404c', { rot: [0, a, 0], shadow: false }); }
  cyl(g, .03, .03, .32, x, .05, z, '#5b6372');
  rbox(g, .44, .08, .44, x, .37, z, col, { r: .03 });
  const [bx, bz] = back, h = .5 + tall;
  rbox(g, bx ? .07 : .44, h, bz ? .07 : .44, x + bx * .22, .45, z + bz * .22, col, { r: .03 });
}
function desk(g, d) {
  const x = d.x, z = d.y;
  rbox(g, DESK_W, .06, DESK_D, x, .68, z, C.desk, { r: .02 });
  for (const s of [-1, 1]) rbox(g, .06, .68, DESK_D - .12, x + s * (DESK_W / 2 - .08), 0, z, C.deskEdge, { r: .01 });
  rbox(g, .46, .62, DESK_D - .2, x + (d.far ? 1 : -1) * (DESK_W / 2 - .38), 0, z, C.deskEdge, { r: .02 });
  // a monitor on a stand, facing the seat / 받침 위 모니터, 자리를 향해
  const f = d.far ? -1 : 1;
  rbox(g, .26, .02, .18, x, .74, z + f * .12, '#3a404c', { r: .01 });
  cyl(g, .025, .025, .2, x, .75, z + f * .12, '#3a404c');
  const scr = rbox(g, .8, .46, .04, x, .92, z + f * .16, C.mon, { r: .02 });
  scr.userData.keep = true; d.screen = scr;
}
function bookshelf(g, x, z, w, h) {
  rbox(g, w, h, .45, x, 0, z, C.counter, { r: .02 });
  const tex = canvasTex(256, 192, (c, W, H) => {
    c.fillStyle = '#6e5238'; c.fillRect(0, 0, W, H);
    const cols = ['#c0504d', '#4f81bd', '#9bbb59', '#8064a2', '#f2b632', '#4bacc6', '#e46c0a'];
    for (let r = 0; r < 3; r++) { let u = 6; const y0 = 8 + r * 62; while (u < W - 10) { const bw = 7 + Math.random() * 8, bh = 44 + Math.random() * 12; c.fillStyle = cols[Math.floor(Math.random() * cols.length)]; c.fillRect(u, y0 + 54 - bh, bw, bh); u += bw + 2; } c.fillStyle = '#4e3a28'; c.fillRect(0, y0 + 54, W, 6); }
  });
  const face = new THREE.Mesh(new THREE.PlaneGeometry(w - .06, h - .06), new THREE.MeshStandardMaterial({ map: tex, roughness: .8 }));
  face.position.set(x, h / 2, z + .231); g.add(face);
}

function build(lay) {
  if (world) { scene.remove(world); world.traverse(o => { if (o.isMesh && o.userData.merged) o.geometry.dispose(); }); }
  world = new THREE.Group();
  const stat = new THREE.Group(), live = new THREE.Group();
  world.add(stat, live);
  const { LOFF, GY } = lay, cx = GX / 2;
  // floors / 바닥
  rbox(stat, GX, .12, GY, cx, -.12, GY / 2, C.lounge, { r: .02 });
  rbox(stat, 15.6, .02, 1 + lay.rows * 4.2 - .6, 7.8, 0, (1 + lay.rows * 4.2 - .6) / 2, C.floor, { r: .005, shadow: false });
  rbox(stat, 6, .02, ROOM_Y, 19, 0, ROOM_Y / 2, C.meet, { r: .005, shadow: false });
  rbox(stat, 4, .02, ROOM_Y, 24, 0, ROOM_Y / 2, C.boss, { r: .005, shadow: false });
  rbox(stat, 5.6, .02, GY - 7, 23.2, 0, 7 + (GY - 7) / 2, C.grass, { r: .005, shadow: false });
  for (let y = 0; y < 6; y++) for (let x = (y % 2); x < 7; x += 2) rbox(stat, 1, .022, 1, x + .5, 0, 9.4 + LOFF + y + .5, C.tile, { r: .002, shadow: false });
  for (let i = 0; i < lay.pods; i++) { const p = podAt(i); rbox(stat, 6, .025, 3.5, p.x + 2.9, 0, p.y + 1.5, '#f6dfa6', { r: .005, shadow: false }); }
  // back walls with windows / 창 있는 뒷벽
  const winMat = mat('#cfe3f5', { op: .5, rough: .1 });
  for (let x = 0; x < GX; x += 1) {
    const win = x >= 1 && x < 15 && (x - 1) % 3 < 2;
    if (win) { rbox(stat, 1, .5, .14, x + .5, 0, 0, C.wall, { r: .01 }); rbox(stat, 1, .4, .14, x + .5, WALL - .4, 0, C.wall, { r: .01 }); mesh(stat, geo('win', () => new THREE.BoxGeometry(1, WALL - .9, .04)), null, x + .5, .5 + (WALL - .9) / 2, 0, { material: winMat, shadow: false }); }
    else rbox(stat, 1, WALL, .14, x + .5, 0, 0, C.wall, { r: .01 });
  }
  rbox(stat, .14, WALL, GY, 0, 0, GY / 2, C.wall, { r: .01 });
  rbox(stat, GX + .1, .08, .2, cx, WALL, 0, C.wallEdge, { r: .02 }); rbox(stat, .2, .08, GY, 0, WALL, GY / 2, C.wallEdge, { r: .02 });
  // the elevator / 엘리베이터
  rbox(stat, .06, 1.9, 1.3, .1, 0, 9.1 + LOFF, '#b8c0cc', { r: .01 });
  // glass rooms / 유리 방
  const glass = mat('#a9c8e6', { op: .22, rough: .05 });
  const pane = (x0, z0, x1, z1) => { const w = Math.hypot(x1 - x0, z1 - z0), m = mesh(live, geo(`g${w}`, () => new THREE.BoxGeometry(w, 1.9, .03)), null, (x0 + x1) / 2, .95, (z0 + z1) / 2, { material: glass, shadow: false }); m.rotation.y = -Math.atan2(z1 - z0, x1 - x0); };
  pane(16, 0, 16, ROOM_Y); pane(22, 0, 22, ROOM_Y); pane(16, ROOM_Y, 19, ROOM_Y); pane(20, ROOM_Y, 23, ROOM_Y); pane(24, ROOM_Y, 26, ROOM_Y);
  for (const x of [16, 19, 20, 22, 23, 24, 26]) rbox(stat, .05, 1.9, .05, x, 0, ROOM_Y, C.wallEdge, { r: .01 });
  rbox(stat, 10, .05, .05, 21, 1.9, ROOM_Y, C.wallEdge, { r: .01 });
  // meeting room: a round table, chairs, the whiteboard / 회의실: 둥근 탁자, 의자, 화이트보드
  cyl(stat, .35, .45, .05, MEET_C.x, 0, MEET_C.y, '#7a5a3c'); cyl(stat, .07, .07, .66, MEET_C.x, .05, MEET_C.y, '#7a5a3c'); cyl(stat, 1.05, 1.05, .06, MEET_C.x, .7, MEET_C.y, C.desk);
  for (const p of MEET_CHAIRS) { const dx = p.x - MEET_C.x, dz = p.y - MEET_C.y; chair(stat, p.x, p.y, Math.abs(dx) > Math.abs(dz) ? [Math.sign(dx), 0] : [0, Math.sign(dz)]); }
  rbox(stat, 3, 1.3, .05, 18.6, .8, .1, '#ffffff', { r: .02 }); rbox(stat, 3.1, .05, .1, 18.6, .78, .12, '#9aa3b2', { r: .01 });
  // boss room: desk, chair, the question window sign, the honey shelf and comb / 사장실: 책상, 의자, 질문 창구, 꿀 선반과 벌집
  rbox(stat, 1.7, .78, .7, 24.85, 0, 2.65, C.counter, { r: .03 }); chair(stat, 24.8, 1.6, [0, -1], '#3a404c', .25);
  const sign = canvasTex(256, 64, (c, W, H) => { c.fillStyle = '#c77d00'; c.beginPath(); c.roundRect(4, 4, W - 8, H - 8, 28); c.fill(); c.fillStyle = '#1b1300'; c.font = '700 30px -apple-system, sans-serif'; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText(tr('질문 창구', 'Questions'), W / 2, H / 2 + 2); });
  const sg = new THREE.Mesh(new THREE.PlaneGeometry(1.2, .3), new THREE.MeshStandardMaterial({ map: sign, transparent: true })); sg.position.set(24.85, 1.85, 3.05); live.add(sg);
  rbox(stat, 2.2, .06, .42, 23.4, .45, .3, C.counter, { r: .01 });
  for (let i = 0; i < 6; i++) for (let j = 0; j < 4; j++) mesh(stat, geo('hex', () => new THREE.CylinderGeometry(.13, .13, .05, 6)), '#e9c25a', 22.9 + i * .23 + (j % 2) * .115, 1.2 + j * .2, .1, { rot: [Math.PI / 2, 0, 0], shadow: false });
  // pods: desks, chairs, dividers / 섬: 책상, 의자, 칸막이
  for (const d of lay.desks) { desk(stat, d); chair(stat, d.seat.x, d.seat.y, [0, d.far ? -1 : 1]); }
  for (let i = 0; i < lay.pods; i++) { const p = podAt(i); rbox(stat, 5.3, .5, .05, p.x + 2.95, .74, p.y + 1.5, '#9fb7c9', { r: .01, op: .55 }); }
  for (let i = lay.pods; i < lay.rows * POD_ROW; i++) { const { x, y } = podAt(i); bookshelf(stat, x + 2.9, y + 1.8, 2.6, 1.35); plant(stat, x + 1.1, y + 1, 1.2); plant(stat, x + 4.8, y + 2.2, .9); }
  // cafe / 카페
  rbox(stat, .9, .78, 4, .75, 0, 11.8 + LOFF, C.counter, { r: .03 }); rbox(stat, 1.05, .06, 4.1, .75, .78, 11.8 + LOFF, '#b08a64', { r: .02 });

function drawClock() {

  c.fillStyle = '#7a8394'; for (let i = 0; i < 12; i++) { const a = i / 12 * Math.PI * 2; c.fillRect(64 + Math.sin(a) * 46 - 2, 64 - Math.cos(a) * 46 - 2, 4, 4); }

// ── bees / 벌 ────────────────────────────────────────────────────────────────────────────────
const BEE = { body: '#f2b632', dark: '#23201a', wing: '#cfe4f7', cheek: '#f08a7a' };

  const limb = (x, y, len, r) => { const p = new THREE.Group(); p.position.set(x, y, 0); body.add(p); cyl(p, r, r, len, 0, -len, 0, BEE.dark); return p; };
  const legL = limb(-.07, .24, .2, .035), legR = limb(.07, .24, .2, .035);
  ball(body, .2, 0, .38, 0, BEE.body, { scale: [1, 1.15, .95] });
  for (const [y, s] of [[.31, 1.01], [.43, 1]]) mesh(body, geo('stripe', () => new THREE.TorusGeometry(.19, .035, 8, 24)), BEE.dark, 0, y, 0, { rot: [Math.PI / 2, 0, 0], scale: [s, s, 1.4] });
  const armL = limb(-.2, .48, .16, .03), armR = limb(.2, .48, .16, .03);
  const head = new THREE.Group(); head.position.set(0, .72, 0); body.add(head);
  ball(head, .19, 0, 0, 0, BEE.body);
  for (const s of [-1, 1]) { ball(head, .05, s * .075, .03, .16, '#ffffff', { shadow: false }); ball(head, .03, s * .075, .03, .2, BEE.dark, { shadow: false }); ball(head, .035, s * .12, -.05, .15, BEE.cheek, { shadow: false, scale: [1, .6, .5] }); }
  for (const s of [-1, 1]) { const a = cyl(head, .012, .012, .2, s * .07, .14, 0, BEE.dark); a.rotation.z = -s * .35; ball(head, .035, s * .13, .33, 0, BEE.dark); }
  const wings = [-1, 1].map(s => { const w = new THREE.Group(); w.position.set(s * .1, .55, -.14); body.add(w); mesh(w, geo('wing', () => new THREE.CircleGeometry(.16, 20)), null, s * .12, .08, 0, { material: mat(BEE.wing, { op: .6 }), shadow: false, scale: [1, 1.5, 1], rot: [0, s * .5, 0] }); return w; });
  const jar = new THREE.Group(); jar.position.set(0, 1.08, .05); body.add(jar); cyl(jar, .1, .1, .16, 0, 0, 0, BEE.body); cyl(jar, .11, .11, .04, 0, .16, 0, '#d2ad52'); jar.visible = false;

const bees = new Map();
let offices = [], lastPoll = 0;
async function poll() {
  try {
    const s = await (await fetch('/state', { cache: 'no-store' })).json();
    L = s.lang || 'ko'; offices = s.offices || [];
  } catch (e) { return; }
  const me = offices[0]; if (!me) return;
  const sessions = offices.flatMap((o, oi) => o.sessions.map(x => ({ ...x, ssh: o.ssh || '', oi })));
  const lay = layout(sessions);
  if (!LAY || LAY.sig !== lay.sig) { LAY = lay; build(lay); for (const b of bees.values()) b.deskId = null; }
  else LAY.spots = lay.spots;
  const seen = new Set();
  for (const s of OFF.bees ? [] : sessions) {
    const key = `${s.ssh}|${s.pane}`; seen.add(key);
    let b = bees.get(key);
    if (!b) { const m = makeBee(); b = { key, m, x: .9, y: 9.1 + LAY.LOFF, tag: document.createElement('div'), phase: Math.random() * 9 }; b.tag.className = 'tag'; $('#tags').append(b.tag); scene.add(m.g); bees.set(key, b); }
    Object.assign(b, { s, state: s.state });
  }
  for (const [k, b] of bees) if (!seen.has(k)) { scene.remove(b.m.g); b.tag.remove(); bees.delete(k); }

}
function plan() {
  const all = [...bees.values()], taken = new Set();
  for (const b of all) { if (b.state === 'idle') b.deskId = null; else if (b.deskId && !taken.has(b.deskId)) taken.add(b.deskId); else b.deskId = null; }
  for (const b of all.filter(b => b.state !== 'idle' && !b.deskId)) { const d = LAY.desks.find(d => !taken.has(d.id)); if (d) { b.deskId = d.id; taken.add(d.id); } }
  const waits = all.filter(b => b.state === 'wait').sort((a, c) => a.s.at - c.s.at), spots = LAY.spots.slice();
  let si = 0;
  for (const b of all) {
    const d = b.deskId && LAY.desks.find(x => x.id === b.deskId);
    b.desk = d;
    if (b.state === 'run' && d) b.goal = { ...d.seat, pose: 'type', face: d.far ? 1 : -1 };
    else if (b.state === 'wait') b.goal = { ...qSpot(waits.indexOf(b)), pose: 'wait', face: -1 };
    else if (b.state === 'done' && d) b.goal = { x: d.seat.x + .6, y: d.seat.y, pose: 'done', face: d.far ? 1 : -1 };
    else { const sp = spots[si++ % spots.length]; b.goal = { x: sp.x, y: sp.y, pose: sp.kind === 'sofa' ? 'sofa' : sp.kind === 'coffee' ? 'stool' : 'idle', face: sp.kind === 'sofa' ? 1 : 0 }; }

}
// through the room doors when going in or out of the glass rooms / 유리 방에 드나들 때는 문으로
function route(b, g) {
  const inRoom = p => p.y < ROOM_Y && p.x > 16, door = p => ({ x: p.x < 22 ? 19.55 : 23.55, y: ROOM_Y });
  const pts = [];
  if (inRoom(b) && !inRoom(g)) pts.push({ ...door(b), y: ROOM_Y - .4 }, { ...door(b), y: ROOM_Y + .5 });
  if (!inRoom(b) && inRoom(g)) pts.push({ ...door(g), y: ROOM_Y + .5 }, { ...door(g), y: ROOM_Y - .4 });
  if (inRoom(b) && inRoom(g) && (b.x < 22) !== (g.x < 22)) pts.push({ ...door(b), y: ROOM_Y - .4 }, { ...door(b), y: ROOM_Y + .5 }, { ...door(g), y: ROOM_Y + .5 }, { ...door(g), y: ROOM_Y - .4 });

const STATE_COL = { run: '#2f7fd6', wait: '#c77d00', done: '#1d9a64', idle: '#8b94a5' };
function stepBee(b, dt, t) {

  }

}

// ── camera: turn, tilt, zoom, pan, like the 2D office / 카메라: 돌리기, 기울이기, 확대, 옮기기 ─────────────
const target = new THREE.Vector3(13, 0, 8);
const view = { angle: -.62, elev: .78, dist: 46 }, want = { angle: -.62, elev: .78, dist: 46, target: target.clone() };
function placeCamera(dt) {

  camera.position.set(target.x + Math.sin(view.angle) * Math.cos(view.elev) * view.dist, target.y + Math.sin(view.elev) * view.dist, target.z + Math.cos(view.angle) * Math.cos(view.elev) * view.dist);

let drag = null;
canvas.addEventListener('pointerdown', e => { drag = { x: e.clientX, y: e.clientY, pan: e.shiftKey || e.button === 2, moved: 0 }; canvas.setPointerCapture(e.pointerId); canvas.classList.add('drag'); });
canvas.addEventListener('pointermove', e => {
  if (!drag) return;
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y; drag.x = e.clientX; drag.y = e.clientY; drag.moved += Math.abs(dx) + Math.abs(dy);
  if (drag.pan) { const s = want.dist / 900, r = new THREE.Vector3(Math.cos(view.angle), 0, -Math.sin(view.angle)), f = new THREE.Vector3(-Math.sin(view.angle), 0, -Math.cos(view.angle)); want.target.addScaledVector(r, -dx * s).addScaledVector(f, dy * s); }

  const hit = ray.intersectObjects([...bees.values()].map(b => b.m.g), true)[0];
  const b = hit && [...bees.values()].find(x => x.m.g === hit.object.userData.bee);
  if (b) fetch('/goto', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ pane: b.s.pane, ssh: b.s.ssh || null }) });
}

// ── day and night from the clock / 시계를 따라 낮과 밤 ──────────────────────────────────────────────
function light() {
  const h = new Date().getHours() + new Date().getMinutes() / 60, day = Math.max(0, Math.min(1, (Math.sin((h - 6) / 24 * Math.PI * 2) + .25) * 1.4));

  sun.color.set(day > .5 ? 0xfff0d8 : 0xffc89a);
  scene.background.set(day > .3 ? '#cfe3f2' : '#28324a');
  const a = -.9 + (h / 24) * Math.PI * 2;
  sun.position.set(target.x + Math.cos(a) * 20, 25, target.z + Math.sin(a) * 12 + 10); sun.target.position.copy(target);
  if (world) { world.userData.lamp.intensity = day < .5 ? 6 : 0; world.userData.shadeM.material = mat(day < .5 ? '#ffe2a8' : '#efe6d6', { em: day < .5 ? '#a8783a' : undefined }); }
}

// ── the loop: 60 frames a second while things move, 20 when still, none when hidden ───────────────
// ── 루프: 움직이면 초당 60장, 가만하면 20장, 안 보이면 0 ────────────────────────────────────────────

setTimeout(() => { $('#hint').style.display = 'none'; }, 8000);
