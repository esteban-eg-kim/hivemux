<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>hivemux office</title>
<link rel="icon" href="/logo.svg" type="image/svg+xml">
<style>
/* Layout: an office floor seen at an angle (canvas): desks in the back corner, the meeting room and the
   boss room behind glass, the lounge in front. It fills the window; the buttons float on top, and the
   session list is a drawer over one side (right or left, in the settings). */
:root {
  --bg: #e9edf3; --panel: #ffffff; --line: #d3d9e3; --fg: #1b1f27; --muted: #677083;
  --run: #2f7fd6; --wait: #c77d00; --done: #1d9a64; --sleep: #8b94a5; --alert: #d9473a; --honey: #f2b632; --bee-dark: #23201a;
  --o-grass: #a8d38c; --o-grass2: #a0cc84; --o-wild: #93c47a; --o-wild2: #86b96e; --o-sea: #2f6fb3; --o-ice: #eef3f8; --o-river: #5aa7e0; --o-roof: #d9824b; --o-roof2: #c26f3c; --o-soil: #9a7350; --o-path: #e9e0cf; --o-leaf: #5fae5a; --o-leaf2: #4f9b4c; --o-trunk: #7a5636; --o-hedge: #4f9450; --o-hive: #f2c14e; --o-lamp: #ffd98a;
  --m-wall: #3b4250; --m-wallface: #f4efe6; --m-window: #cfe3f5; --m-glass: rgba(170, 200, 230, .28); --m-grass: #d9ead2; --m-lid: #8d96a6; --m-counter: #8a6a4a; --m-office: #efe6d6; --m-plank: rgba(120, 90, 50, .09); --m-remote: #e7e3ef; --m-hall: #dde2ea;
  --m-meet: #d5e1ef; --m-lounge: #f3f5f8; --m-tile: #e3e7ee; --m-mine: #ece5d6; --m-rug: rgba(242, 182, 50, .22); --m-zone: rgba(242, 182, 50, .2); --m-zone-remote: rgba(167, 139, 250, .22);
  --m-desk: #c99c6a; --m-desk-edge: #9c7448; --m-chair: #4a5160; --m-mon: #2a2e37; --m-screen: #14171d;
  --m-sofa: #5a7bb5; --m-plant: #4caf6e; --m-pot: #b56a45; --m-pong: #2f8f5b; --m-board: #ffffff; --m-wax: #f1e2b4; --m-wax-edge: #d2ad52;
  --m-label: #6b7383; --m-shadow: rgba(0, 0, 0, .14); --m-wing: rgba(170, 205, 245, .75);
  --tag-bg: rgba(255, 255, 255, .94); --tag-fg: #1b1f27;
  --scrim: rgba(233, 237, 243, .78);
  --f-body: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", sans-serif;
  --f-mono: ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #101217; --panel: #1a1d24; --line: #2b303b; --fg: #e1e6f0; --muted: #8b93a3;
  --run: #5aa9ff; --wait: #f5a524; --done: #3ecf8e; --sleep: #6b7385; --alert: #ff6b5a;
  --o-grass: #46683a; --o-grass2: #426236; --o-wild: #3d5d33; --o-wild2: #37542e; --o-sea: #1d3f6b; --o-ice: #c9d2de; --o-river: #2f6a9c; --o-roof: #9a5a34; --o-roof2: #864d2c; --o-soil: #4e3a28; --o-path: #6f6a62; --o-leaf: #3a7237; --o-leaf2: #30622e; --o-trunk: #5a3f28; --o-hedge: #356b37; --o-hive: #c99a32; --o-lamp: #ffd98a;
  --m-wall: #5a6375; --m-wallface: #2a2d35; --m-window: #22344a; --m-glass: rgba(120, 160, 210, .16); --m-grass: #1f2b20; --m-lid: #5b6372; --m-counter: #5b4430; --m-office: #29251f; --m-plank: rgba(255, 255, 255, .035); --m-remote: #25222d; --m-hall: #1b1e25;
  --m-meet: #1d2532; --m-lounge: #22252c; --m-tile: #1c1f25; --m-mine: #28251e; --m-rug: rgba(242, 182, 50, .12); --m-zone: rgba(242, 182, 50, .12); --m-zone-remote: rgba(167, 139, 250, .16);
  --m-desk: #7a5a3c; --m-desk-edge: #5b412a; --m-chair: #3a404c; --m-mon: #4a5160; --m-screen: #0b0d11;
  --m-sofa: #3d5683; --m-plant: #3d9a5d; --m-pot: #8a4f33; --m-pong: #23704a; --m-board: #d9dee8; --m-wax: #3e341c; --m-wax-edge: #7d6427;
  --m-label: #8b93a3; --m-shadow: rgba(0, 0, 0, .35); --m-wing: rgba(220, 235, 255, .55);
  --tag-bg: rgba(30, 33, 41, .94); --tag-fg: #e1e6f0;
  --scrim: rgba(16, 18, 23, .74); color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #101217; --panel: #1a1d24; --line: #2b303b; --fg: #e1e6f0; --muted: #8b93a3;
  --run: #5aa9ff; --wait: #f5a524; --done: #3ecf8e; --sleep: #6b7385; --alert: #ff6b5a;
  --o-grass: #46683a; --o-grass2: #426236; --o-wild: #3d5d33; --o-wild2: #37542e; --o-sea: #1d3f6b; --o-ice: #c9d2de; --o-river: #2f6a9c; --o-roof: #9a5a34; --o-roof2: #864d2c; --o-soil: #4e3a28; --o-path: #6f6a62; --o-leaf: #3a7237; --o-leaf2: #30622e; --o-trunk: #5a3f28; --o-hedge: #356b37; --o-hive: #c99a32; --o-lamp: #ffd98a;
  --m-wall: #5a6375; --m-wallface: #2a2d35; --m-window: #22344a; --m-glass: rgba(120, 160, 210, .16); --m-grass: #1f2b20; --m-lid: #5b6372; --m-counter: #5b4430; --m-office: #29251f; --m-plank: rgba(255, 255, 255, .035); --m-remote: #25222d; --m-hall: #1b1e25;
  --m-meet: #1d2532; --m-lounge: #22252c; --m-tile: #1c1f25; --m-mine: #28251e; --m-rug: rgba(242, 182, 50, .12); --m-zone: rgba(242, 182, 50, .12); --m-zone-remote: rgba(167, 139, 250, .16);
  --m-desk: #7a5a3c; --m-desk-edge: #5b412a; --m-chair: #3a404c; --m-mon: #4a5160; --m-screen: #0b0d11;
  --m-sofa: #3d5683; --m-plant: #3d9a5d; --m-pot: #8a4f33; --m-pong: #23704a; --m-board: #d9dee8; --m-wax: #3e341c; --m-wax-edge: #7d6427;
  --m-label: #8b93a3; --m-shadow: rgba(0, 0, 0, .35); --m-wing: rgba(220, 235, 255, .55);
  --tag-bg: rgba(30, 33, 41, .94); --tag-fg: #e1e6f0;
  --scrim: rgba(16, 18, 23, .74); color-scheme: dark }

html, body { height: 100%; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.45 var(--f-body); overflow-x: hidden; }
.app { position: relative; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible { outline: 2px solid var(--run); outline-offset: 2px; }
.seg input:focus-visible + span { outline: 2px solid var(--run); outline-offset: 2px; }

/* the buttons float over the office on frosted bars / 버튼은 사무실 위에 반투명 막대로 뜬다 */
.glass { background: color-mix(in srgb, var(--panel) 78%, transparent); -webkit-backdrop-filter: blur(12px) saturate(1.2); backdrop-filter: blur(12px) saturate(1.2);
  border: 1px solid color-mix(in srgb, var(--line) 80%, transparent); box-shadow: 0 4px 16px rgba(0, 0, 0, .10); border-radius: 12px; }
.top { position: absolute; left: 12px; top: 12px; z-index: 6; display: flex; align-items: center; gap: 12px; padding: 6px 10px 6px 8px; transition: left .25s; }
.brand { display: flex; align-items: center; gap: 8px; font: 600 16px var(--f-mono); }
.brand svg { width: 26px; height: 26px; }
.chips { display: flex; gap: 6px; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 9px; border: 1px solid var(--line); border-radius: 999px; font-size: 12px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.chip i { width: 8px; height: 8px; border-radius: 50%; background: var(--c); }
.chip b { font: 600 12px var(--f-mono); }
.chip.hot { border-color: var(--wait); animation: chip 1.2s ease-in-out infinite; }
@keyframes chip { 50% { box-shadow: 0 0 0 4px color-mix(in srgb, var(--wait) 25%, transparent); } }

.floor { position: relative; flex: 1; min-height: 0; overflow: hidden; background: var(--panel); }
#map { display: block; width: 100%; cursor: default; }
#map.hand { cursor: pointer; }
.view { position: absolute; right: 12px; top: 12px; z-index: 6; display: flex; gap: 6px; align-items: center; padding: 5px; transition: right .25s; }
.view .sep { width: 1px; height: 20px; background: var(--line); margin: 0 3px; }
.listbtn { gap: 6px; padding: 0 9px 0 7px !important; font: 600 12px var(--f-mono) !important; }
.listbtn i { width: 8px; height: 8px; border-radius: 50%; background: var(--wait); }
.listbtn.hot { border-color: var(--wait); animation: chip 1.2s ease-in-out infinite; }
.open .listbtn { background: color-mix(in srgb, var(--run) 14%, var(--panel)); border-color: var(--run); }
/* icon buttons, pairs joined in one pill (turn, height, zoom) / 아이콘 버튼. 짝(돌리기, 높이, 확대)은 한 알약으로 붙인다 */
.view button { display: inline-flex; align-items: center; justify-content: center; min-width: 30px; height: 30px; padding: 0 7px; box-sizing: border-box;
  border-radius: 8px; border: 1px solid var(--line); background: var(--panel); color: var(--fg); line-height: 1; box-shadow: 0 1px 2px rgba(0, 0, 0, .06); }
.view button:hover { background: color-mix(in srgb, var(--fg) 6%, var(--panel)); }
.view button:active { transform: translateY(1px); }
.view svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.view .vg { display: inline-flex; border-radius: 8px; box-shadow: 0 1px 2px rgba(0, 0, 0, .06); }
.view .vg button { box-shadow: none; }
.view .vg button + button { margin-left: -1px; }
.view .vg button:first-child { border-radius: 8px 0 0 8px; }
.view .vg button:last-child { border-radius: 0 8px 8px 0; }
.plan .view .vg-tilt { display: none; }
.view .v-mode { font: 700 11px var(--f-mono); letter-spacing: .02em; }
#map { touch-action: none; }
#map.grab { cursor: grabbing; }
.tip { position: absolute; z-index: 5; pointer-events: none; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 6px 9px; font-size: 12px; box-shadow: 0 6px 18px rgba(0, 0, 0, .18); max-width: 240px; }
.tip b { display: block; }
.tip span { color: var(--muted); display: block; }
.tip span.task { color: var(--fg); font-weight: 600; }

/* the session list: a drawer over the right (or left) side / 세션 목록: 오른쪽(또는 왼쪽) 위에 겹치는 서랍 */
.drawer { position: absolute; top: 0; bottom: 0; right: 0; width: var(--drawer); z-index: 8; display: flex; flex-direction: column; box-sizing: border-box;
  background: color-mix(in srgb, var(--panel) 84%, transparent); -webkit-backdrop-filter: blur(16px) saturate(1.2); backdrop-filter: blur(16px) saturate(1.2);
  border-left: 1px solid var(--line); box-shadow: -10px 0 30px rgba(0, 0, 0, .12); transform: translateX(105%); transition: transform .25s ease, visibility .25s; visibility: hidden; }
.left .drawer { right: auto; left: 0; border-left: 0; border-right: 1px solid var(--line); box-shadow: 10px 0 30px rgba(0, 0, 0, .12); transform: translateX(-105%); }
.open .drawer { transform: none; visibility: visible; }
.app { --drawer: min(340px, 100vw - 48px); }
.open:not(.left) .view, .open:not(.left) .settings { right: calc(var(--drawer) + 12px); }
.open.left .top { left: calc(var(--drawer) + 12px); }
.d-head { display: flex; align-items: center; gap: 8px; padding: 14px 14px 10px; border-bottom: 1px solid var(--line); }
.d-head b { font-size: 14px; }
.tabs { display: flex; gap: 2px; background: color-mix(in srgb, var(--fg) 6%, transparent); border-radius: 8px; padding: 2px; }
.tabs button { border: 0; background: transparent; padding: 4px 10px; border-radius: 6px; font-size: 13px; font-weight: 600; color: var(--muted); width: auto !important; height: auto !important; margin: 0 !important; }
.tabs button[aria-selected="true"] { background: var(--panel); color: var(--fg); box-shadow: 0 1px 2px rgba(0, 0, 0, .08); }
.periods { margin: 10px 2px 8px; }
.ranks { list-style: none; margin: 0; padding: 0; display: grid; gap: 5px; }
.ranks li { display: grid; grid-template-columns: 30px 1fr auto; align-items: center; gap: 8px; padding: 7px 10px; border: 1px solid var(--line); border-radius: 8px; background: color-mix(in srgb, var(--panel) 92%, transparent); }
.ranks li:hover { outline: 2px solid var(--honey); outline-offset: -1px; }
.ranks .m { font: 700 14px var(--f-mono); text-align: center; }
.ranks .who b { display: block; font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ranks .who span { font-size: 11px; color: var(--muted); }
.ranks .h { font: 700 12px var(--f-mono); color: var(--wait); white-space: nowrap; }
.ranks li.gone { opacity: .55; }
.shiftbtn { gap: 5px; padding: 0 9px 0 7px !important; font-size: 12px !important; font-weight: 600; }
.shiftbtn.off { background: #2c3060 !important; color: #fff; border-color: #2c3060 !important; }
.ask { position: absolute; inset: 0; z-index: 30; display: grid; place-items: center; background: color-mix(in srgb, var(--bg) 40%, transparent); backdrop-filter: blur(2px); }
.ask-card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px; width: min(340px, calc(100vw - 48px)); box-shadow: 0 16px 40px rgba(0, 0, 0, .25); text-align: center; }
.ask-card p { margin: 0 0 4px; font-size: 14px; font-weight: 600; }
.ask-card .ask-n { font-size: 12px; font-weight: 400; color: var(--muted); }
.macs { display: grid; gap: 6px; margin-top: 12px; text-align: left; }
.mac { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 10px; }
.mac span { flex: 1; font-size: 13px; font-weight: 600; min-width: 0; }
.mac small { display: block; font-size: 11.5px; font-weight: 400; color: var(--muted); }
.mac button { padding: 6px 12px; border-radius: 8px; border: 1px solid var(--line); font-size: 12.5px; font-weight: 600; background: var(--bg); }
.mac button.out { background: #2c3060; border-color: #2c3060; color: #fff; }
.mac button.in { background: var(--wait); border-color: var(--wait); color: #1b1300; }
.mac.all { justify-content: flex-end; border-style: dashed; }
.d-head span { font-size: 12px; color: var(--muted); }
.d-head em { font-style: normal; color: var(--wait); font-weight: 600; }
.d-head button { margin-left: auto; width: 26px; height: 26px; border-radius: 7px; border: 1px solid var(--line); background: var(--panel); line-height: 1; }
.d-body { flex: 1; overflow-y: auto; padding: 4px 10px 14px; }
.roster { display: grid; grid-template-columns: 1fr; gap: 5px; }
.grp { font: 600 10.5px var(--f-mono); letter-spacing: .06em; color: var(--muted); padding: 10px 4px 3px; display: flex; gap: 6px; align-items: center; }
.grp i { width: 9px; height: 9px; border-radius: 3px; background: var(--c); }
/* little room: the chips keep the dot and the number / 자리가 좁으면 칩은 점과 숫자만 */
@media (max-width: 1450px) { .open .top .chip { font-size: 0; gap: 5px; padding: 3px 8px; } .open .top .chip b { font-size: 12px; } .open .brand { font-size: 0; gap: 0; } }
@media (max-width: 1100px) { .top .chip { font-size: 0; gap: 5px; padding: 3px 8px; } .top .chip b { font-size: 12px; } }
/* a small window: the list just covers the office / 작은 창: 목록이 사무실을 그냥 덮는다 */
@media (max-width: 760px) { .open .top { display: none; } .open:not(.left) .view, .open:not(.left) .settings { right: 12px; } .top .chips .chip:nth-child(n+4) { display: none; } }
.r { display: grid; grid-template-columns: auto 1fr auto; gap: 1px 8px; align-items: baseline; text-align: left; padding: 7px 10px; border: 1px solid var(--line); border-radius: 8px; background: color-mix(in srgb, var(--panel) 92%, transparent); min-width: 0; }
.r:hover { outline: 2px solid var(--honey); outline-offset: -1px; }
.r .k { font: 400 10.5px var(--f-mono); color: var(--muted); }
.r .n { font-size: 12.5px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.r .e { font: 600 11px var(--f-mono); color: var(--st); font-variant-numeric: tabular-nums; white-space: nowrap; }
.r .w { grid-column: 1 / -1; font-size: 11.5px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.r .w i { font-style: normal; color: var(--st); }
.r.s-home { --st: var(--sleep); opacity: .75; }
.r.s-run { --st: var(--run); } .r.s-wait { --st: var(--wait); border-color: var(--wait); } .r.s-done { --st: var(--done); } .r.s-idle { --st: var(--sleep); }

.note { font-size: 12.5px; color: var(--muted); padding: 10px 12px; border: 1px dashed var(--line); border-radius: 8px; }
.lost { position: fixed; left: 50%; top: 12px; translate: -50% 0; z-index: 35; background: var(--alert); color: #fff; padding: 6px 12px; border-radius: 8px; font-size: 12.5px; max-width: calc(100vw - 32px); box-sizing: border-box; }
.check { display: flex; gap: 8px; align-items: center; font-size: 12.5px; cursor: pointer; }
.settings { position: absolute; right: 12px; top: 60px; transition: right .25s; z-index: 20; width: min(300px, calc(100vw - 32px)); background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px; box-shadow: 0 12px 32px rgba(0, 0, 0, .22); display: flex; flex-direction: column; gap: 12px; box-sizing: border-box; }
.settings fieldset { border: 0; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.settings legend { font-size: 11px; font-weight: 600; letter-spacing: .06em; color: var(--muted); margin-bottom: 6px; padding: 0; }
.seg { display: flex; flex-wrap: wrap; gap: 4px; }
.seg label { position: relative; }
.seg input { position: absolute; opacity: 0; }
.seg span { display: block; padding: 5px 10px; border: 1px solid var(--line); border-radius: 7px; font-size: 12px; cursor: pointer; }
.seg input:checked + span { border-color: var(--run); background: color-mix(in srgb, var(--run) 14%, transparent); }
.settings p { margin: 0; font-size: 11px; color: var(--muted); }

.pop { position: fixed; inset: 0; z-index: 30; display: grid; place-items: center; background: var(--scrim); backdrop-filter: blur(3px); animation: fade .25s; padding-inline: 16px; }
@keyframes fade { from { opacity: 0; } }
.pop.leaving { animation: fade .3s reverse forwards; }
.pop-box { display: flex; flex-direction: column; align-items: center; gap: 6px; max-width: 360px; width: 100%; }
.pop-bee { width: 132px; height: 132px; position: relative; }
.pop-bee .ring { position: absolute; inset: -10px; border-radius: 50%; border: 3px solid var(--wait); opacity: 0; }
.pop-wob { width: 100%; height: 100%; }
@keyframes hop2 { to { transform: translateY(-8px); } }
.pop-wob canvas { width: 100%; height: 100%; display: block; }
.pop-card { background: var(--panel); border: 2px solid var(--wait); border-radius: 14px; padding: 14px 16px; text-align: center; width: 100%; box-sizing: border-box; box-shadow: 0 16px 40px rgba(0, 0, 0, .25); position: relative; animation: card .45s .15s cubic-bezier(.2, 1.5, .4, 1) backwards; }
.pop-card::before { content: ""; position: absolute; left: 50%; top: -9px; width: 14px; height: 14px; background: var(--panel); border-left: 2px solid var(--wait); border-top: 2px solid var(--wait); transform: translateX(-50%) rotate(45deg); }
@keyframes card { from { transform: scale(.6); opacity: 0; } }
.pop-h { font-size: 17px; font-weight: 600; text-wrap: balance; }
.pop-r { font-size: 13px; color: var(--muted); margin-top: 2px; }
.pop-w { font: 600 13px var(--f-mono); color: var(--wait); margin-top: 6px; font-variant-numeric: tabular-nums; }
.pop-more { font-size: 12px; color: var(--muted); }
.pop-why { margin-top: 10px; padding: 10px 12px; border-radius: 10px; background: color-mix(in srgb, var(--wait) 12%, var(--panel)); text-align: left; }
.pop-why b { display: block; font-size: 15px; color: var(--wait); }
.pop-why span { display: block; font-size: 14px; margin-top: 3px; overflow-wrap: anywhere; }
.pop-why[data-kind="error"] { background: color-mix(in srgb, var(--alert) 12%, var(--panel)); }
.pop-why[data-kind="error"] b { color: var(--alert); }
.pop-q { margin-top: 10px; font-size: 14px; font-weight: 600; text-align: left; white-space: pre-line; max-height: 9em; overflow: auto; }
.pop-opts { display: flex; flex-direction: column; gap: 6px; margin-top: 8px; text-align: left; }
.pop-opts button.opt { display: flex; gap: 10px; align-items: baseline; width: 100%; padding: 9px 12px; border-radius: 9px; border: 1px solid var(--line); background: var(--bg); font-size: 14px; text-align: left; color: var(--fg); cursor: pointer; }
.pop-opts button.opt:hover:not(:disabled) { border-color: var(--wait); }
.pop-opts button.opt:disabled { opacity: .5; cursor: default; }
.pop-opts button.opt .n { font: 600 12px var(--f-mono); color: var(--muted); min-width: 1.2em; }
.pop-opts button.opt .l { flex: 1; overflow-wrap: anywhere; }
.pop-opts button.opt .l small { display: block; color: var(--muted); font-size: 12px; margin-top: 1px; }
.pop-opts button.opt.first { border-color: var(--wait); background: color-mix(in srgb, var(--wait) 14%, var(--bg)); font-weight: 600; }
.pop-opts button.opt.on .n { color: var(--done); }
.pop-opts .say { display: flex; gap: 6px; }
.pop-opts .say textarea { flex: 1; min-height: 2.6em; resize: vertical; border-radius: 9px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); padding: 8px 10px; font: 14px var(--f-body); }
.pop-opts .say button, .pop-opts .next { padding: 8px 14px; border-radius: 9px; border: 1px solid var(--wait); background: var(--wait); color: #1b1300; font-weight: 600; font-size: 13px; }
.pop-opts .next { align-self: flex-end; }
.pop.acting .pop-box { max-width: 460px; }
.pop-act { display: flex; gap: 8px; justify-content: center; margin-top: 12px; }
.pop-act button { padding: 8px 16px; border-radius: 9px; border: 1px solid var(--line); background: var(--bg); font-size: 13px; }
.pop-act .go { background: var(--wait); border-color: var(--wait); color: #1b1300; font-weight: 600; }
.pop[data-lvl="2"] .ring { animation: ring 1s ease-out infinite; }
.pop[data-lvl="3"] .pop-wob { animation: shake .16s linear infinite; }
.pop[data-lvl="3"] .ring { border-color: var(--alert); animation: ring .7s ease-out infinite; }
.pop[data-lvl="3"] .pop-card, .pop[data-lvl="3"] .pop-card::before { border-color: var(--alert); }
.pop[data-lvl="3"] .pop-w { color: var(--alert); }
@keyframes ring { from { opacity: .9; transform: scale(.8); } to { opacity: 0; transform: scale(1.3); } }
@keyframes shake { 0%, 100% { transform: translate(0, 0) rotate(0); } 25% { transform: translate(-4px, -2px) rotate(-6deg); } 75% { transform: translate(4px, 1px) rotate(6deg); } }

.toast { position: fixed; left: 50%; bottom: 18px; translate: -50% 0; z-index: 40; background: var(--fg); color: var(--bg); padding: 8px 14px; border-radius: 9px; font-size: 13px; max-width: calc(100vw - 32px); box-sizing: border-box; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; }
}

<script>
/* The bee office page, served by bin/hivemux-office. It polls /state every second and moves one bee
   per Claude session; POST /goto shows a session in the terminal.
   벌 사무실 페이지. bin/hivemux-office 가 준다. 1초마다 /state 를 읽어 Claude 세션마다 벌 한 마리를
   움직이고, POST /goto 로 그 세션을 터미널에 띄운다. */
const $ = s => document.querySelector(s);
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
const rand = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.floor(Math.random() * a.length)];
const native = window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.office;
const tell = msg => { try { native && native.postMessage(msg); } catch (e) {} };

let lang = (navigator.language || 'en').startsWith('ko') ? 'ko' : 'en';
const tr = (ko, en) => lang === 'ko' ? ko : en;
function applyLang() {
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-t]').forEach(el => { const [ko, en] = el.dataset.t.split('|'); el.textContent = tr(ko, en); });
  $('#gear').setAttribute('aria-label', tr('설정', 'Settings'));
  if (typeof PLAN !== 'undefined') planTitle();
  if (typeof SHIFT !== 'undefined' && $('#shiftbtn')) updateShiftBtn();
  $('#pop-later').textContent = tr('나중에', 'Later');
  for (const [id, ko, en] of [['v-left', '왼쪽으로 돌리기 (Q, 오른쪽 버튼으로 끌기)', 'Turn left (Q, or right-drag)'], ['v-right', '오른쪽으로 돌리기 (E, 오른쪽 버튼으로 끌기)', 'Turn right (E, or right-drag)'],
    ['v-up', '더 높이서 보기 (W, 오른쪽 버튼으로 위로 끌기)', 'Look from higher (W, or right-drag up)'], ['v-down', '더 낮게 보기 (S, 오른쪽 버튼으로 아래로 끌기)', 'Look from lower (S, or right-drag down)'],
    ['v-out', '축소 (-, 휠)', 'Zoom out (-, wheel)'], ['v-in', '확대 (+, 휠)', 'Zoom in (+, wheel)'], ['v-home', '전체 보기 (0)', 'Whole floor (0)'], ['listbtn', '세션 목록 (L)', 'Session list (L)'], ['d-close', '닫기 (Esc)', 'Close (Esc)']]) { const el = $('#' + id); el.title = tr(ko, en); el.setAttribute('aria-label', tr(ko, en)); }
  $('#map').setAttribute('aria-label', tr('벌 사무실. Claude 세션마다 벌 한 마리가 자리, 회의실, 라운지, 사장실 질문 창구를 오가요.',
    'Bee office. One bee per Claude session moves between its desk, the meeting room, the lounge and the question window in the boss room.'));
}

const settings = { pop: 'front', privacy: 'all', sound: 'off', sky: 'auto', side: 'right' };
try { Object.assign(settings, JSON.parse(localStorage.getItem('office-settings') || '{}')); } catch (e) {}
const saveSettings = () => { try { localStorage.setItem('office-settings', JSON.stringify(settings)); } catch (e) {} };

const LABEL = { run: ['일하는 중', 'working'], wait: ['기다림', 'waiting'], done: ['끝남', 'done'], idle: ['쉬는 중', 'resting'], home: ['퇴근', 'home'], bye: ['퇴사', 'leaving'] };
const label = st => tr(...(LABEL[st] || LABEL.idle));
const PLAN_TALK = [['순서부터 정하고', 'Order first'], ['1단계, 2단계…', 'Step 1, step 2…'], ['여기가 핵심', 'This is the key'], ['위험한 곳 체크', 'Mark the risks'], ['음…', 'Hmm…'], ['파일 세 개만 고치면 돼요', 'Just three files']];
const CREW_TALK = [['이건 어때요?', 'How about this?'], ['엣지 케이스는요?', 'Edge cases?'], ['좋은데요', 'Nice'], ['테스트도 넣죠', 'Add tests too'], ['포스트잇 붙일게요', 'Sticky note!'], ['일정은요?', 'Timeline?']];
const HELP_TALK = [['찾았어요!', 'Found it!'], ['이 파일이에요', 'This file'], ['보고서 드릴게요', 'Report coming'], ['다 읽었어요', 'Read it all'], ['…', '…']];
const CHAT_TALK = [['ㅋㅋㅋ', 'haha'], ['점심 뭐 먹지', 'Lunch?'], ['꿀 맛있다', 'Nice honey'], ['…', '…'], ['아까 그 버그 봤어?', 'Saw that bug?'], ['오늘 빠르네', 'Fast day']];

/* ---------- the floor, seen at an angle (isometric) ----------
   World units are floor tiles: x runs to the lower right of the screen, y to the lower left, and the
   two back walls stand on x = 0 and y = 0. Bees walk and plan in tiles; P() turns a floor point into
   a screen point only when drawing.
   Back corner: the work area, pods of four desks for the sessions that are not resting (hot desks;
   resting bees have no desk). Right of it the meeting room and the boss room behind glass. The front
   half is the lounge: a cafe, a sofa corner, ping-pong and a garden.
   바닥 단위는 타일: x 는 화면 오른쪽 아래, y 는 왼쪽 아래로 가고 뒷벽 둘은 x = 0, y = 0 에 선다.
   벌은 타일 좌표로 걷고 계획하며, 그릴 때만 P() 로 화면 좌표가 된다.
   안쪽 구석이 작업 공간: 쉬지 않는 세션 수만큼 4인용 책상 섬 (공용 책상. 쉬는 벌은 자리가 없다).
   그 오른쪽에 유리벽 회의실과 사장실. 앞쪽 절반은 라운지: 카페, 소파 코너, 탁구대, 정원. */
const TW = 32, WALL = 74, BEE = 1.05;   // half a tile on screen, back wall height, bee size
// the viewing height: TH is how tall half a tile looks (16 = the classic angle, 32 = from straight above);
// heights shrink as the view climbs (ZF is 1 at the classic angle)
// 보는 높이: TH 는 타일 반쪽이 보이는 높이 (16 = 기본 각도, 32 = 바로 위). 높이 올라갈수록 세로 높이는 줄어든다 (기본 각도에서 ZF = 1)
let TH = 16, ZF = 1;
function setTilt(k) { TH = TW * k; ZF = Math.sqrt(Math.max(0, 1 - k * k)) / Math.sqrt(.75); }
// how flat the view is: 0 at the highest 3D angle, 1 seen from straight above / 얼마나 납작한지: 3D 의 가장 높은 각도 0, 바로 위 1
const flat = () => Math.max(0, Math.min(1, (TH / TW - .85) / .15));
// the view turns the floor around its middle before the angled projection (ROT in radians)
// 보기 회전: 비스듬히 그리기 전에 바닥을 가운데를 중심으로 돌린다 (ROT, 라디안)
let ROT = 0, COS = 1, SIN = 0, CX = 13, CY = 8;
const turn = (x, y) => { const dx = x - CX, dy = y - CY; return [CX + dx * COS - dy * SIN, CY + dx * SIN + dy * COS]; };
const P = (x, y, z = 0) => { const [rx, ry] = turn(x, y); return { x: (rx - ry) * TW, y: (rx + ry) * TH - z * ZF }; };
const D = (x, y) => { const [rx, ry] = turn(x, y); return rx + ry; };   // depth: larger is nearer / 깊이: 클수록 가깝다
// does a floor direction point toward the viewer, and to which side of the screen
// 바닥 위 방향이 보는 사람 쪽인지, 화면 어느 쪽인지
const toward = (dx, dy) => (dx * COS - dy * SIN) + (dx * SIN + dy * COS) > 0;
const sideOf = (dx, dy) => (dx * COS - dy * SIN) - (dx * SIN + dy * COS) >= 0 ? 1 : -1;
const GX = 26;
let LAY = null;
const ROOMS = {
  meet: { x0: 16, x1: 22, door: 19, name: ['회의실', 'Meeting room'] },
  boss: { x0: 22, x1: 26, door: 23, name: ['사장실', 'Boss room'] },
};
const ROOM_Y = 6;   // the glass front of both rooms / 두 방의 유리벽 앞면
const MEET_C = { x: 19, y: 3.1 };
const MEET_CHAIRS = Array.from({ length: 6 }, (_, i) => { const a = -Math.PI / 2 + i * Math.PI / 3; return { x: MEET_C.x + Math.cos(a) * 1.75, y: MEET_C.y + Math.sin(a) * 1.75 }; });
const MEET_STAND = [{ x: 16.6, y: 0.9 }, { x: 21.4, y: 0.9 }, { x: 16.6, y: 5.3 }, { x: 21.4, y: 5.3 }, { x: 17.6, y: 5.5 }, { x: 20.4, y: 5.5 }];
const BOARD_SPOT = { x: 18.4, y: 0.75 };   // in front of the whiteboard / 화이트보드 앞
// helper bees around a seat; the far row has room behind it, the near row in front
// 자리 옆 부사수 위치. 먼 줄은 뒤쪽에, 가까운 줄은 앞쪽에 자리가 있다
const HELP_FAR = [{ dx: -.6, dy: -.4 }, { dx: .6, dy: -.4 }, { dx: 0, dy: -.8 }];
const HELP_NEAR = [{ dx: -.6, dy: .45 }, { dx: .6, dy: .45 }, { dx: 0, dy: .85 }];
const COMB_SPOT = { x: 23.1, y: .85 };
const qSpot = i => i < 6 ? { x: 24.3 + (i % 2) * .8, y: 3.75 + Math.floor(i / 2) * .65 } : { x: 22.6 - ((i - 6) % 4) * .7, y: 6.9 + Math.floor((i - 6) / 4) * .7 };
// resting spots; shift: in the cafe and sofa corner, which move down when the work area grows
// 쉬는 자리. shift: 작업 공간이 커지면 같이 내려가는 카페와 소파 코너
const SPOT_DEF = [
  ['sofa', 8.6, 11.85, 1], ['sofa', 9.8, 11.85, 1], ['sofa', 11, 11.85, 1], ['sofa', 12.2, 11.85, 1],
  ['coffee', 1.95, 10.6, 1], ['coffee', 1.95, 11.8, 1], ['coffee', 1.95, 13, 1],

  b.title = tr('퇴근 / 출근: Mac 마다 고르기', 'Clock out / in, Mac by Mac');
}
// the card: a row per Mac with its button, and "all" when there are several / 카드: Mac 마다 한 줄과 버튼, 여럿이면 "모두"
function askShift() {
  const ms = macs(), list = $('#ask-macs');
  $('#ask-q').textContent = tr('누가 퇴근하거나 출근할까요?', 'Who clocks out or in?');
  $('#ask-n').textContent = tr('퇴근하면 Claude 를 끄고, 일하는 벌은 끝난 뒤 퇴근해요 (야근). 출근하면 모두 같은 대화로 다시 시작해요.',
    'Clocking out stops the Claudes (busy ones after they finish); clocking in brings each back in the same conversation.');
  list.replaceChildren(...ms.map(m => {
    const row = document.createElement('div'); row.className = 'mac';
    const name = document.createElement('span');
    name.textContent = `${m.o.host}${m.oi === 0 ? tr(' (이 Mac)', ' (this Mac)') : ''}`;
    const st = document.createElement('small');
    st.textContent = m.off ? tr(`🌙 퇴근 중 · ${m.home}마리 집에${m.working ? ` · ${m.working}마리 야근` : ''}`, `🌙 home: ${m.home}${m.working ? ` · ${m.working} on overtime` : ''}`)
      : tr(`${m.working}마리 근무${m.busy ? ` · ${m.busy}마리 일하는 중` : ''}`, `${m.working} at work${m.busy ? ` · ${m.busy} busy` : ''}`);
    name.append(st);
    const go = document.createElement('button'); go.type = 'button'; go.className = m.off ? 'in' : 'out';
    go.textContent = m.off ? tr('출근', 'Clock in') : tr('퇴근', 'Clock out');
    go.addEventListener('click', () => shiftMac(m.o, m.off ? 'on' : 'off'));
    row.append(name, go); return row;
  }));
  if (ms.length > 1) {
    const anyOn = ms.some(m => !m.off), row = document.createElement('div'); row.className = 'mac all';
    const go = document.createElement('button'); go.type = 'button'; go.className = anyOn ? 'out' : 'in';
    go.textContent = anyOn ? tr('모두 퇴근', 'Everyone clocks out') : tr('모두 출근', 'Everyone clocks in');
    go.addEventListener('click', () => ms.filter(m => m.off === !anyOn).forEach(m => shiftMac(m.o, anyOn ? 'off' : 'on')));
    row.append(go); list.append(row);
  }
  $('#ask').hidden = false;
}
async function shiftMac(o, to) {
  $('#ask').hidden = true;
  try {
    const r = await fetch('/shift', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ to, ssh: o.ssh || null }) });
    const j = await r.json();
    toast(j.ok ? `${o.host}: ${j.say || (to === 'off' ? tr('퇴근', 'clocked out') : tr('출근', 'clocked in'))}`
      : tr(`${o.host} 에서 하지 못했어요. 거기 hivemux 를 업데이트하세요.`, `Could not on ${o.host}. Update hivemux there.`));
  } catch (e) { toast(tr('hivemux 에 닿지 못했어요.', 'Could not reach hivemux.')); }
}
$('#shiftbtn').addEventListener('click', askShift);
$('#ask-no').addEventListener('click', () => { $('#ask').hidden = true; });
let TAB = 's';
function setTab(k) {
  TAB = k; $('#tab-s').setAttribute('aria-selected', String(k === 's')); $('#tab-r').setAttribute('aria-selected', String(k === 'r'));
  $('#pane-s').hidden = k !== 's'; $('#pane-r').hidden = k !== 'r'; renderRanks();
}
$('#tab-s').addEventListener('click', () => setTab('s')); $('#tab-r').addEventListener('click', () => setTab('r'));
$('#periods').addEventListener('change', renderRanks);
function renderRanks() {
  if (TAB !== 'r') return;
  const period = ($('#periods input:checked') || {}).value || 'day', list = (RANKS && RANKS[period]) || [], ol = $('#ranks');
  ol.replaceChildren(...list.map((e, i) => {
    const r = ROSTER[e.id], li = document.createElement('li');
    li.className = r && r.left ? 'gone' : '';
    const m = document.createElement('span'); m.className = 'm'; m.textContent = ['🥇', '🥈', '🥉'][i] || `${i + 1}`;
    const who = document.createElement('span'); who.className = 'who';
    const n = document.createElement('b'); n.textContent = r ? (r.name === 'claude' ? r.project : r.name) : e.id.split('/').pop();
    const pj = document.createElement('span'); pj.textContent = (r ? r.project : e.id.split('/')[0]) + (r && r.left ? tr(' · 퇴사', ' · left') : r && r.rehires ? tr(` · 재입사 ${r.rehires}`, ` · rehired ×${r.rehires}`) : '');
    who.append(n, pj);
    const h = document.createElement('span'); h.className = 'h'; h.textContent = tr(`꿀 ${e.honey}칸`, `${e.honey} honey`);
    li.append(m, who, h);
    li.addEventListener('mouseenter', () => { const b = [...bees.values()].find(x => x.bee === e.id); hoverKey = b ? b.key : null; });
    li.addEventListener('mouseleave', () => { hoverKey = null; });
    return li;
  }));
  const empty = $('#ranks-empty'); empty.hidden = list.length > 0;
  empty.textContent = tr('아직 모은 꿀이 없어요. 작업이 끝날 때마다 그 벌의 꿀이 한 칸씩 쌓여요.', 'No honey yet. Each finished task adds a cell for its bee.');
}
const app = $('.app');
function setDrawer(open) {
  DRAWER.open = open; app.classList.toggle('open', open);
  $('#listbtn').setAttribute('aria-expanded', String(open));
  try { localStorage.setItem('office-list', open ? '1' : '0'); } catch (e) {}
  render();
}
const applySide = () => app.classList.toggle('left', settings.side === 'left');
$('#listbtn').addEventListener('click', () => setDrawer(!DRAWER.open));
$('#d-close').addEventListener('click', () => setDrawer(false));
addEventListener('keydown', e => {
  if (e.target.closest && e.target.closest('input, textarea, select') || e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key.toLowerCase() === 'l') { setDrawer(!DRAWER.open); e.preventDefault(); }
  else if (e.key === 'Escape' && DRAWER.open && !pop) setDrawer(false);
}, true);   // before the pop-out's Esc, so one Esc closes only that / 튀어나오기의 Esc 보다 먼저: Esc 한 번에 그것만 닫히게
applySide(); setDrawer(DRAWER.open); setPlan(PLAN.on); updateShiftBtn();

applyLang(); readTokens();
addEventListener('resize', resize);
new ResizeObserver(resize).observe($('#floor'));
// Opened as a browser app window (no window app: app_browser in bin/hivemux-office), each 🐝 opens a new one
// and macOS won't let hivemux bring an old one to the front: the new one says so and the older ones close
// 브라우저 앱 창으로 열면 (창 앱이 없을 때: bin/hivemux-office 의 app_browser) 🐝 를 누를 때마다 새 창이 뜨고,
// macOS 는 hivemux 가 예전 창을 앞으로 가져오지 못하게 한다: 새 창이 알리고 예전 창은 닫힌다
if (matchMedia('(display-mode: standalone)').matches && window.BroadcastChannel) {
  const ch = new BroadcastChannel('hivemux-office');
  ch.onmessage = e => { if (e.data === 'opened') window.close(); };
  ch.postMessage('opened');
}
poll();
requestAnimationFrame(frame);
</script>
