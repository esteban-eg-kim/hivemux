<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>hivemux office</title>
<link rel="icon" href="/logo.svg" type="image/svg+xml">
<style>
/* Layout: an office floor seen at an angle (canvas): desks in the back corner, the meeting room and the
   boss room behind glass, the lounge in front. The roster below. */
:root {
  --bg: #e9edf3; --panel: #ffffff; --line: #d3d9e3; --fg: #1b1f27; --muted: #677083;
  --run: #2f7fd6; --wait: #c77d00; --done: #1d9a64; --sleep: #8b94a5; --alert: #d9473a; --honey: #f2b632; --bee-dark: #23201a;
  --o-grass: #a8d38c; --o-grass2: #a0cc84; --o-wild: #93c47a; --o-wild2: #86b96e; --o-sea: #2f6fb3; --o-ice: #eef3f8; --o-soil: #9a7350; --o-path: #e9e0cf; --o-leaf: #5fae5a; --o-leaf2: #4f9b4c; --o-trunk: #7a5636; --o-hedge: #4f9450; --o-hive: #f2c14e; --o-lamp: #ffd98a;
  --m-wall: #3b4250; --m-wallface: #f4efe6; --m-window: #cfe3f5; --m-glass: rgba(170, 200, 230, .28); --m-grass: #d9ead2; --m-lid: #8d96a6; --m-counter: #8a6a4a; --m-office: #efe6d6; --m-plank: rgba(120, 90, 50, .09); --m-remote: #e7e3ef; --m-hall: #dde2ea;
  --m-meet: #d5e1ef; --m-lounge: #f3f5f8; --m-tile: #e3e7ee; --m-mine: #ece5d6; --m-rug: rgba(242, 182, 50, .22);
  --m-desk: #c99c6a; --m-desk-edge: #9c7448; --m-chair: #4a5160; --m-mon: #2a2e37; --m-screen: #14171d;
  --m-sofa: #5a7bb5; --m-plant: #4caf6e; --m-pot: #b56a45; --m-pong: #2f8f5b; --m-board: #ffffff; --m-wax: #f1e2b4; --m-wax-edge: #d2ad52;
  --m-label: #6b7383; --m-shadow: rgba(0, 0, 0, .14); --m-wing: rgba(170, 205, 245, .75);
  --tag-bg: rgba(255, 255, 255, .94); --tag-fg: #1b1f27;
  --scrim: rgba(233, 237, 243, .78);
  --f-body: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", sans-serif;
  --f-mono: ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #101217; --panel: #1a1d24; --line: #2b303b; --fg: #e1e6f0; --muted: #8b93a3;
  --run: #5aa9ff; --wait: #f5a524; --done: #3ecf8e; --sleep: #6b7385; --alert: #ff6b5a;
  --o-grass: #46683a; --o-grass2: #426236; --o-wild: #3d5d33; --o-wild2: #37542e; --o-sea: #1d3f6b; --o-ice: #c9d2de; --o-soil: #4e3a28; --o-path: #6f6a62; --o-leaf: #3a7237; --o-leaf2: #30622e; --o-trunk: #5a3f28; --o-hedge: #356b37; --o-hive: #c99a32; --o-lamp: #ffd98a;
  --m-wall: #5a6375; --m-wallface: #2a2d35; --m-window: #22344a; --m-glass: rgba(120, 160, 210, .16); --m-grass: #1f2b20; --m-lid: #5b6372; --m-counter: #5b4430; --m-office: #29251f; --m-plank: rgba(255, 255, 255, .035); --m-remote: #25222d; --m-hall: #1b1e25;
  --m-meet: #1d2532; --m-lounge: #22252c; --m-tile: #1c1f25; --m-mine: #28251e; --m-rug: rgba(242, 182, 50, .12);
  --m-desk: #7a5a3c; --m-desk-edge: #5b412a; --m-chair: #3a404c; --m-mon: #4a5160; --m-screen: #0b0d11;
  --m-sofa: #3d5683; --m-plant: #3d9a5d; --m-pot: #8a4f33; --m-pong: #23704a; --m-board: #d9dee8; --m-wax: #3e341c; --m-wax-edge: #7d6427;
  --m-label: #8b93a3; --m-shadow: rgba(0, 0, 0, .35); --m-wing: rgba(220, 235, 255, .55);
  --tag-bg: rgba(30, 33, 41, .94); --tag-fg: #e1e6f0;
  --scrim: rgba(16, 18, 23, .74); color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #101217; --panel: #1a1d24; --line: #2b303b; --fg: #e1e6f0; --muted: #8b93a3;
  --run: #5aa9ff; --wait: #f5a524; --done: #3ecf8e; --sleep: #6b7385; --alert: #ff6b5a;
  --o-grass: #46683a; --o-grass2: #426236; --o-wild: #3d5d33; --o-wild2: #37542e; --o-sea: #1d3f6b; --o-ice: #c9d2de; --o-soil: #4e3a28; --o-path: #6f6a62; --o-leaf: #3a7237; --o-leaf2: #30622e; --o-trunk: #5a3f28; --o-hedge: #356b37; --o-hive: #c99a32; --o-lamp: #ffd98a;
  --m-wall: #5a6375; --m-wallface: #2a2d35; --m-window: #22344a; --m-glass: rgba(120, 160, 210, .16); --m-grass: #1f2b20; --m-lid: #5b6372; --m-counter: #5b4430; --m-office: #29251f; --m-plank: rgba(255, 255, 255, .035); --m-remote: #25222d; --m-hall: #1b1e25;
  --m-meet: #1d2532; --m-lounge: #22252c; --m-tile: #1c1f25; --m-mine: #28251e; --m-rug: rgba(242, 182, 50, .12);
  --m-desk: #7a5a3c; --m-desk-edge: #5b412a; --m-chair: #3a404c; --m-mon: #4a5160; --m-screen: #0b0d11;
  --m-sofa: #3d5683; --m-plant: #3d9a5d; --m-pot: #8a4f33; --m-pong: #23704a; --m-board: #d9dee8; --m-wax: #3e341c; --m-wax-edge: #7d6427;
  --m-label: #8b93a3; --m-shadow: rgba(0, 0, 0, .35); --m-wing: rgba(220, 235, 255, .55);
  --tag-bg: rgba(30, 33, 41, .94); --tag-fg: #e1e6f0;
  --scrim: rgba(16, 18, 23, .74); color-scheme: dark }

html, body { height: 100%; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--fg); font: 14px/1.45 var(--f-body); overflow-x: hidden; }
.app { position: relative; min-height: 100%; display: flex; flex-direction: column; gap: 12px; padding-inline: 16px; padding-block: 14px 12px; max-width: 1000px; margin: 0 auto; box-sizing: border-box; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible { outline: 2px solid var(--run); outline-offset: 2px; }
.seg input:focus-visible + span { outline: 2px solid var(--run); outline-offset: 2px; }

.top { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 8px; font: 600 16px var(--f-mono); }
.brand svg { width: 26px; height: 26px; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; margin-left: auto; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 9px; border: 1px solid var(--line); border-radius: 999px; font-size: 12px; background: var(--panel); font-variant-numeric: tabular-nums; }
.chip i { width: 8px; height: 8px; border-radius: 50%; background: var(--c); }
.chip b { font: 600 12px var(--f-mono); }
.chip.hot { border-color: var(--wait); animation: chip 1.2s ease-in-out infinite; }
@keyframes chip { 50% { box-shadow: 0 0 0 4px color-mix(in srgb, var(--wait) 25%, transparent); } }
.gear { width: 32px; height: 32px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); display: grid; place-items: center; }
.gear svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.8; }

.floor { position: relative; border-radius: 12px; overflow: hidden; border: 1px solid var(--line); background: var(--panel); }
#map { display: block; width: 100%; cursor: default; }
#map.hand { cursor: pointer; }
.view { position: absolute; right: 8px; top: 8px; z-index: 4; display: flex; gap: 4px; }
.view button { min-width: 28px; height: 28px; padding: 0 7px; border-radius: 7px; border: 1px solid var(--line); background: var(--panel); font-size: 14px; line-height: 1; box-shadow: 0 1px 3px rgba(0, 0, 0, .08); }
.view .v-mode { font: 600 11px var(--f-mono); margin-right: 4px; }
#map { touch-action: none; }
#map.grab { cursor: grabbing; }
.tip { position: absolute; z-index: 5; pointer-events: none; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 6px 9px; font-size: 12px; box-shadow: 0 6px 18px rgba(0, 0, 0, .18); max-width: 240px; }
.tip b { display: block; }
.tip span { color: var(--muted); }

.roster { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 6px; }
.r { display: grid; grid-template-columns: auto 1fr auto; gap: 1px 8px; align-items: baseline; text-align: left; padding: 7px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); min-width: 0; }
.r .k { font: 400 10.5px var(--f-mono); color: var(--muted); }
.r .n { font-size: 12.5px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.r .e { font: 600 11px var(--f-mono); color: var(--st); font-variant-numeric: tabular-nums; white-space: nowrap; }
.r .w { grid-column: 1 / -1; font-size: 11.5px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.r .w i { font-style: normal; color: var(--st); }
.r.s-run { --st: var(--run); } .r.s-wait { --st: var(--wait); border-color: var(--wait); } .r.s-done { --st: var(--done); } .r.s-idle { --st: var(--sleep); }

.note { font-size: 12.5px; color: var(--muted); padding: 10px 12px; border: 1px dashed var(--line); border-radius: 8px; }
.lost { position: fixed; left: 50%; top: 12px; translate: -50% 0; z-index: 35; background: var(--alert); color: #fff; padding: 6px 12px; border-radius: 8px; font-size: 12.5px; max-width: calc(100vw - 32px); box-sizing: border-box; }
.check { display: flex; gap: 8px; align-items: center; font-size: 12.5px; cursor: pointer; }
.settings { position: absolute; right: 16px; top: 56px; z-index: 20; width: min(300px, calc(100vw - 32px)); background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px; box-shadow: 0 12px 32px rgba(0, 0, 0, .22); display: flex; flex-direction: column; gap: 12px; box-sizing: border-box; }
.settings fieldset { border: 0; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.settings legend { font-size: 11px; font-weight: 600; letter-spacing: .06em; color: var(--muted); margin-bottom: 6px; padding: 0; }
.seg { display: flex; flex-wrap: wrap; gap: 4px; }
.seg label { position: relative; }
.seg input { position: absolute; opacity: 0; }
.seg span { display: block; padding: 5px 10px; border: 1px solid var(--line); border-radius: 7px; font-size: 12px; cursor: pointer; }
.seg input:checked + span { border-color: var(--run); background: color-mix(in srgb, var(--run) 14%, transparent); }
.settings p { margin: 0; font-size: 11px; color: var(--muted); }

.pop { position: fixed; inset: 0; z-index: 30; display: grid; place-items: center; background: var(--scrim); backdrop-filter: blur(3px); animation: fade .25s; padding-inline: 16px; }
@keyframes fade { from { opacity: 0; } }
.pop.leaving { animation: fade .3s reverse forwards; }
.pop-box { display: flex; flex-direction: column; align-items: center; gap: 6px; max-width: 360px; width: 100%; }
.pop-bee { width: 132px; height: 132px; position: relative; }
.pop-bee .ring { position: absolute; inset: -10px; border-radius: 50%; border: 3px solid var(--wait); opacity: 0; }
.pop-wob { width: 100%; height: 100%; }
@keyframes hop2 { to { transform: translateY(-8px); } }
.pop-wob canvas { width: 100%; height: 100%; display: block; }
.pop-card { background: var(--panel); border: 2px solid var(--wait); border-radius: 14px; padding: 14px 16px; text-align: center; width: 100%; box-sizing: border-box; box-shadow: 0 16px 40px rgba(0, 0, 0, .25); position: relative; animation: card .45s .15s cubic-bezier(.2, 1.5, .4, 1) backwards; }
.pop-card::before { content: ""; position: absolute; left: 50%; top: -9px; width: 14px; height: 14px; background: var(--panel); border-left: 2px solid var(--wait); border-top: 2px solid var(--wait); transform: translateX(-50%) rotate(45deg); }
@keyframes card { from { transform: scale(.6); opacity: 0; } }
.pop-h { font-size: 17px; font-weight: 600; text-wrap: balance; }
.pop-r { font-size: 13px; color: var(--muted); margin-top: 2px; }
.pop-w { font: 600 13px var(--f-mono); color: var(--wait); margin-top: 6px; font-variant-numeric: tabular-nums; }
.pop-more { font-size: 12px; color: var(--muted); }
.pop-act { display: flex; gap: 8px; justify-content: center; margin-top: 12px; }
.pop-act button { padding: 8px 16px; border-radius: 9px; border: 1px solid var(--line); background: var(--bg); font-size: 13px; }
.pop-act .go { background: var(--wait); border-color: var(--wait); color: #1b1300; font-weight: 600; }
.pop[data-lvl="2"] .ring { animation: ring 1s ease-out infinite; }
.pop[data-lvl="3"] .pop-wob { animation: shake .16s linear infinite; }
.pop[data-lvl="3"] .ring { border-color: var(--alert); animation: ring .7s ease-out infinite; }
.pop[data-lvl="3"] .pop-card, .pop[data-lvl="3"] .pop-card::before { border-color: var(--alert); }
.pop[data-lvl="3"] .pop-w { color: var(--alert); }
@keyframes ring { from { opacity: .9; transform: scale(.8); } to { opacity: 0; transform: scale(1.3); } }
@keyframes shake { 0%, 100% { transform: translate(0, 0) rotate(0); } 25% { transform: translate(-4px, -2px) rotate(-6deg); } 75% { transform: translate(4px, 1px) rotate(6deg); } }

.toast { position: fixed; left: 50%; bottom: 18px; translate: -50% 0; z-index: 40; background: var(--fg); color: var(--bg); padding: 8px 14px; border-radius: 9px; font-size: 13px; max-width: calc(100vw - 32px); box-sizing: border-box; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; }
}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand"><img src="/logo.svg" alt="" width="26" height="26">hivemux</div>
    <div class="chips" id="chips"></div>
    <button class="gear" id="gear" type="button" aria-expanded="false" aria-controls="settings">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.2"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1"/></svg>
    </button>
  </header>

  <form class="settings" id="settings" hidden>
    <fieldset>
      <legend data-t="기다리는 세션이 생기면|When a session needs you"></legend>
      <div class="seg">
        <label><input type="radio" name="pop" id="pop-front" value="front"><span data-t="앞으로 튀어나오기|Pop out in front"></span></label>
        <label><input type="radio" name="pop" id="pop-quiet" value="quiet"><span data-t="줄만 서기|Just line up"></span></label>
      </div>
    </fieldset>
    <fieldset>
      <legend data-t="화면에 보여줄 내용|What to show"></legend>
      <div class="seg">
        <label><input type="radio" name="privacy" id="pv-all" value="all"><span data-t="모두|Everything"></span></label>
        <label><input type="radio" name="privacy" id="pv-title" value="title"><span data-t="작업 이름 숨기기|Hide task names"></span></label>
        <label><input type="radio" name="privacy" id="pv-name" value="name"><span data-t="프로젝트 이름도 숨기기|Hide project names too"></span></label>
      </div>
      <p data-t="화면 공유나 스크린샷 할 때 쓰세요.|For screen sharing and screenshots."></p>
    </fieldset>
    <fieldset>
      <legend data-t="소리|Sound"></legend>
      <div class="seg">
        <label><input type="radio" name="sound" id="snd-off" value="off"><span data-t="끄기|Off"></span></label>
        <label><input type="radio" name="sound" id="snd-on" value="on"><span data-t="튀어나올 때 붕|Buzz when popping out"></span></label>
      </div>
    </fieldset>
    <fieldset>
      <legend data-t="낮과 밤|Day and night"></legend>
      <div class="seg">
        <label><input type="radio" name="sky" id="sky-auto" value="auto"><span data-t="시계 따라|Follow the clock"></span></label>
        <label><input type="radio" name="sky" id="sky-day" value="day"><span data-t="늘 낮|Always day"></span></label>
        <label><input type="radio" name="sky" id="sky-night" value="night"><span data-t="늘 밤|Always night"></span></label>
      </div>
    </fieldset>
    <fieldset id="top-set" hidden>
      <legend data-t="창|Window"></legend>
      <label class="check"><input type="checkbox" id="top"><span data-t="다른 창 위에 띄우기 (⌘T)|Keep on top of other windows (⌘T)"></span></label>
    </fieldset>
  </form>

  <div class="floor" id="floor">
    <canvas id="map" role="img"></canvas>
    <div class="view" id="view">
      <button type="button" id="v-2d" class="v-mode">2D</button>
      <button type="button" id="v-left" data-k="rotL">⟲</button>
      <button type="button" id="v-right" data-k="rotR">⟳</button>
      <button type="button" id="v-up" data-k="up">⤒</button>
      <button type="button" id="v-down" data-k="down">⤓</button>
      <button type="button" id="v-out" data-k="out">−</button>
      <button type="button" id="v-in" data-k="in">+</button>
      <button type="button" id="v-home" data-k="home">⌂</button>
    </div>
    <div class="tip" id="tip" hidden></div>
  </div>

  <div class="roster" id="roster"></div>
  <p class="note" id="empty" hidden></p>
</div>

<div class="pop" id="pop" hidden>
  <div class="pop-box">
    <div class="pop-bee" id="pop-bee"><div class="ring"></div><div class="pop-wob"><canvas id="popcv" width="132" height="132"></canvas></div></div>
    <div class="pop-card">
      <div class="pop-h" id="pop-h"></div>
      <div class="pop-r" id="pop-r"></div>
      <div class="pop-w" id="pop-w"></div>
      <div class="pop-more" id="pop-more"></div>
      <div class="pop-act">
        <button type="button" class="go" id="pop-go"></button>
        <button type="button" id="pop-later"></button>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast" hidden></div>
<div class="lost" id="lost" hidden></div>

<script>
/* The bee office page, served by bin/hivemux-office. It polls /state every second and moves one bee
   per Claude session; POST /goto shows a session in the terminal.
   벌 사무실 페이지. bin/hivemux-office 가 준다. 1초마다 /state 를 읽어 Claude 세션마다 벌 한 마리를
   움직이고, POST /goto 로 그 세션을 터미널에 띄운다. */
const $ = s => document.querySelector(s);
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
const rand = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.floor(Math.random() * a.length)];
const native = window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.office;
const tell = msg => { try { native && native.postMessage(msg); } catch (e) {} };

try { if (localStorage.getItem('office-mode') === '2d') location.replace('/2d'); } catch (e) {}
let lang = (navigator.language || 'en').startsWith('ko') ? 'ko' : 'en';
const tr = (ko, en) => lang === 'ko' ? ko : en;
function applyLang() {
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-t]').forEach(el => { const [ko, en] = el.dataset.t.split('|'); el.textContent = tr(ko, en); });
  $('#gear').setAttribute('aria-label', tr('설정', 'Settings'));
  $('#pop-later').textContent = tr('나중에', 'Later');
  for (const [id, ko, en] of [['v-2d', '위에서 본 평면도로 바꾸기', 'Switch to the flat plan'], ['v-left', '왼쪽으로 돌리기 (Q, 오른쪽 버튼으로 끌기)', 'Turn left (Q, or right-drag)'], ['v-right', '오른쪽으로 돌리기 (E, 오른쪽 버튼으로 끌기)', 'Turn right (E, or right-drag)'],
    ['v-up', '더 높이서 보기 (W, 오른쪽 버튼으로 위로 끌기)', 'Look from higher (W, or right-drag up)'], ['v-down', '더 낮게 보기 (S, 오른쪽 버튼으로 아래로 끌기)', 'Look from lower (S, or right-drag down)'],
    ['v-out', '축소 (-, 휠)', 'Zoom out (-, wheel)'], ['v-in', '확대 (+, 휠)', 'Zoom in (+, wheel)'], ['v-home', '전체 보기 (0)', 'Whole floor (0)']]) { const el = $('#' + id); el.title = tr(ko, en); el.setAttribute('aria-label', tr(ko, en)); }
  $('#map').setAttribute('aria-label', tr('벌 사무실. Claude 세션마다 벌 한 마리가 자리, 회의실, 라운지, 사장실 질문 창구를 오가요.',
    'Bee office. One bee per Claude session moves between its desk, the meeting room, the lounge and the question window in the boss room.'));
}

/* ---------- the floor, seen at an angle (isometric) ----------
   World units are floor tiles: x runs to the lower right of the screen, y to the lower left, and the
   two back walls stand on x = 0 and y = 0. Bees walk and plan in tiles; P() turns a floor point into
   a screen point only when drawing.
   Back corner: the work area, pods of four desks for the sessions that are not resting (hot desks;
   resting bees have no desk). Right of it the meeting room and the boss room behind glass. The front
   half is the lounge: a cafe, a sofa corner, ping-pong and a garden.
   바닥 단위는 타일: x 는 화면 오른쪽 아래, y 는 왼쪽 아래로 가고 뒷벽 둘은 x = 0, y = 0 에 선다.
   벌은 타일 좌표로 걷고 계획하며, 그릴 때만 P() 로 화면 좌표가 된다.
   안쪽 구석이 작업 공간: 쉬지 않는 세션 수만큼 4인용 책상 섬 (공용 책상. 쉬는 벌은 자리가 없다).
   그 오른쪽에 유리벽 회의실과 사장실. 앞쪽 절반은 라운지: 카페, 소파 코너, 탁구대, 정원. */
const TW = 32, WALL = 74, BEE = 1.05;   // half a tile on screen, back wall height, bee size
// the viewing height: TH is how tall half a tile looks (16 = the classic angle, 32 = from straight above);
// heights shrink as the view climbs (ZF is 1 at the classic angle)
// 보는 높이: TH 는 타일 반쪽이 보이는 높이 (16 = 기본 각도, 32 = 바로 위). 높이 올라갈수록 세로 높이는 줄어든다 (기본 각도에서 ZF = 1)
let TH = 16, ZF = 1;
function setTilt(k) { TH = TW * k; ZF = Math.sqrt(Math.max(0, 1 - k * k)) / Math.sqrt(.75); }
// the view turns the floor around its middle before the angled projection (ROT in radians)
// 보기 회전: 비스듬히 그리기 전에 바닥을 가운데를 중심으로 돌린다 (ROT, 라디안)

const turn = (x, y) => { const dx = x - CX, dy = y - CY; return [CX + dx * COS - dy * SIN, CY + dx * SIN + dy * COS]; };
const P = (x, y, z = 0) => { const [rx, ry] = turn(x, y); return { x: (rx - ry) * TW, y: (rx + ry) * TH - z * ZF }; };
const D = (x, y) => { const [rx, ry] = turn(x, y); return rx + ry; };   // depth: larger is nearer / 깊이: 클수록 가깝다
// does a floor direction point toward the viewer, and to which side of the screen
// 바닥 위 방향이 보는 사람 쪽인지, 화면 어느 쪽인지
const toward = (dx, dy) => (dx * COS - dy * SIN) + (dx * SIN + dy * COS) > 0;
const sideOf = (dx, dy) => (dx * COS - dy * SIN) - (dx * SIN + dy * COS) >= 0 ? 1 : -1;
const GX = 26;
let LAY = null;
const ROOMS = {
  meet: { x0: 16, x1: 22, door: 19, name: ['회의실', 'Meeting room'] },
  boss: { x0: 22, x1: 26, door: 23, name: ['사장실', 'Boss room'] },

const ROOM_Y = 6;   // the glass front of both rooms / 두 방의 유리벽 앞면
const MEET_C = { x: 19, y: 3.1 };

const MEET_STAND = [{ x: 16.6, y: 0.9 }, { x: 21.4, y: 0.9 }, { x: 16.6, y: 5.3 }, { x: 21.4, y: 5.3 }, { x: 17.6, y: 5.5 }, { x: 20.4, y: 5.5 }];
const BOARD_SPOT = { x: 18.4, y: 0.75 };   // in front of the whiteboard / 화이트보드 앞

  chat: ['카페에서 수다 떠는 중', 'chatting in the cafe'], plant: ['정원에서 화분에 물 주는 중', 'watering the garden'], idle: ['라운지에서 쉬는 중', 'hanging out in the lounge'] };

function layout(offices) {
  // pods of four for the sessions that are not resting, each office's pods one after another
  // 쉬지 않는 세션만큼 4인용 섬. Mac 마다 섬이 이어진다
  const need = offices.map(o => Math.max(1, Math.ceil(o.sessions.filter(s => s.state !== 'idle').length / 4)));
  const pods = [];
  need.forEach((n, oi) => { for (let k = 0; k < n; k++) pods.push({ oi, n: k }); });
  const rows = Math.max(2, Math.ceil(pods.length / 3));
  const LOFF = (rows - 2) * 4.2;
  const desks = [];
  pods.forEach((p, i) => {
    p.x = 1 + (i % 3) * 5; p.y = .7 + Math.floor(i / 3) * 4.2;
    for (let k = 0; k < 4; k++) {
      const far = k < 2, x = p.x + 1 + (k % 2) * 2;   // far row faces this way / 먼 줄은 이쪽을 본다
      desks.push({ id: `${p.oi}:${p.n}:${k}`, oi: p.oi, far, x, y: far ? p.y + 1.15 : p.y + 1.85, seat: { x, y: far ? p.y + .4 : p.y + 2.6 } });
    }
  });
  SPOTS.forEach(s => { s.x = s.x0; s.y = s.y0 + (s.shift ? LOFF : 0); });
  return { pods, desks, byId: new Map(desks.map(d => [d.id, d])), rows, LOFF, GY: 15.4 + LOFF, WORK_D: 1 + rows * 4.2 - .6,
    sig: `${rows}|${pods.map(p => p.oi).join()}`, names: offices.map(o => o.host) };
}
function roomOf(x, y) { return y < ROOM_Y && x >= 16 ? (x < 22 ? ROOMS.meet : ROOMS.boss) : null; }
function route(from, to) {
  const a = roomOf(from.x, from.y), b = roomOf(to.x, to.y), pts = [];
  if (a === b) return [to];
  if (a) pts.push({ x: a.door, y: ROOM_Y - .7 }, { x: a.door, y: ROOM_Y + .7 });
  if (b) pts.push({ x: b.door, y: ROOM_Y + .7 }, { x: b.door, y: ROOM_Y - .7 });
  pts.push(to);
  return pts;
}

/* ---------- live data ---------- */
let offices = [], fetchedAt = 0, honeyTotal = 0, pop = null, failures = 0, hoverKey = null;
const bees = new Map();      // "<host>|<pane>" -> bee
const helpers = new Map();   // "<bee key>|<n>" -> subagent bee

const CREW = [{ key: 'crew|glasses', look: 'glasses' }, { key: 'crew|notes', look: 'notes' }];

function fmt(sec) {
  sec = Math.max(0, Math.floor(sec));
  if (sec >= 3600) return `${Math.floor(sec / 3600)}:${String(Math.floor(sec % 3600 / 60)).padStart(2, '0')}h`;
  return `${Math.floor(sec / 60)}:${String(sec % 60).padStart(2, '0')}`;
}
const fmtLong = sec => { sec = Math.max(0, Math.floor(sec)); return sec < 60 ? tr(`${sec}초`, `${sec}s`) : tr(`${Math.floor(sec / 60)}분 ${sec % 60}초`, `${Math.floor(sec / 60)}m ${sec % 60}s`); };
const ageOf = b => nowOf(b.office) - b.at;

async function poll() {
  try {
    const r = await fetch('/state', { cache: 'no-store' });
    const s = await r.json();
    failures = 0; $('#lost').hidden = true;

  }

}

function ingest(list) {
  list.forEach(o => { o.sessions = o.sessions || []; o.host = o.host || o.ssh || '?'; o.now = o.now || Date.now() / 1000; });
  offices = list; fetchedAt = Date.now();
  honeyTotal = list.reduce((a, o) => a + (o.honey || 0), 0);
  const prev = LAY && LAY.sig;
  LAY = layout(list);
  if (prev !== LAY.sig) resize();
  const seen = new Set();
  list.forEach((o, oi) => o.sessions.forEach(s => {
    const key = `${o.ssh || ''}|${s.pane}`;
    seen.add(key);
    let b = bees.get(key);
    if (!b) {
      b = { key, path: [], face: -1, moving: false, sprint: false, arrived: true, goal: null, phase: Math.random() * 9, spot: null, fresh: true };
      bees.set(key, b);
    }
    const was = b.state;
    Object.assign(b, s, { office: o, oi, ssh: o.ssh || null });
    if (was && was !== b.state) changed(b, was);
  }));
  for (const [k, b] of bees) if (!seen.has(k)) { if (b.spot) b.spot.occ = null; if (pop === b) closePop(); bees.delete(k); }
  plan();
  for (const b of bees.values()) if (b.fresh) { b.fresh = false; const g = b.goal; b.x = g.x; b.y = g.y; b.path = []; b.arrived = true; settle(b); }
  render();

}
function changed(b, prev) {

  if (prev === 'wait' && b.state === 'run') say(b, tr('감사합니다!', 'Thanks!'));
  if (b.state !== 'idle' && b.spot) { b.spot.occ = null; b.spot = null; }

}

  if (!free.length) { b.spot = null; return; }
  // pair up for ping-pong and chat so there is someone to play or talk with / 탁구, 수다는 짝이 있게
  const paired = free.filter(p => (p.kind === 'pong' || p.kind === 'chat') && SPOTS.some(q => q.kind === p.kind && q.occ));
  const p = paired.length && Math.random() < .6 ? pick(paired) : pick(free.filter(p => p.kind !== 'idle').length ? free.filter(p => p.kind !== 'idle') : free);

/* where each bee should be now / 지금 벌이 있을 곳 */
function setTarget(b, key, p, sprint) {

  b.key2 = key; b.goal = p; b.sprint = !!sprint; b.arrived = false;

}
// hot desks: a bee that is not resting keeps its desk, a new one takes the first free desk of its Mac
// 공용 책상: 쉬지 않는 벌은 자기 책상을 지키고, 새로 온 벌은 그 Mac 의 빈 책상 중 첫 자리에 앉는다
function assignDesks(all) {
  const taken = new Set();
  for (const b of all) {
    const d = b.state !== 'idle' && b.deskId && LAY.byId.get(b.deskId);
    if (d && d.oi === b.oi && !taken.has(d.id)) taken.add(d.id); else b.deskId = null;
  }
  for (const b of all.filter(b => b.state !== 'idle' && !b.deskId).sort((a, c) => a.idx - c.idx)) {
    const d = LAY.desks.find(d => d.oi === b.oi && !taken.has(d.id));
    if (d) { taken.add(d.id); b.deskId = d.id; }

function plan() {
  const all = [...bees.values()];

  const waits = all.filter(b => b.state === 'wait').sort((a, b) => a.at - b.at);
  // plan mode: the first planner draws on the whiteboard, the others think at the table
  // 계획 모드: 첫 번째 벌은 화이트보드에 그리고, 나머지는 회의 탁자에서 고민한다
  const seats = [...MEET_CHAIRS, ...MEET_STAND];
  let seat = 0;
  const planners = all.filter(b => b.state === 'run' && b.plan);
  for (const b of all) b.atBoard = false;
  planners.forEach((b, i) => { b.atBoard = i === 0; b.meetSeat = i === 0 ? BOARD_SPOT : seats[Math.min(seat++, seats.length - 1)]; });
  // subagents: small helper bees by the desk, or at the table with a planning bee
  // 서브에이전트: 책상 옆의 작은 부사수 벌. 계획 중인 벌이면 회의 탁자에 같이 앉는다
  const alive = new Set();
  for (const b of all.filter(b => (b.state === 'run' || b.state === 'wait') && b.agents > 0 && b.desk)) {
    const meeting = planners.includes(b), s = b.desk.seat;
    for (let i = 0; i < Math.min(3, b.agents); i++) {
      const k = `${b.key}|${i}`; alive.add(k);
      const o = (b.desk.far ? HELP_FAR : HELP_NEAR)[i];
      const p = meeting ? seats[Math.min(seat++, seats.length - 1)] : { x: s.x + o.dx, y: s.y + o.dy };
      if (!helpers.has(k)) helpers.set(k, { mini: true, host: b, born: performance.now() + i * 350, phase: Math.random() * 9 });
      Object.assign(helpers.get(k), { x: p.x, y: p.y, pose: meeting ? 'meet' : 'help', look: meeting ? [MEET_C.x - p.x, MEET_C.y - p.y] : [s.x - p.x, s.y - p.y] });

  // 누군가 계획하는 동안 동료가 엘리베이터로 올라와 다음 의자에 앉고, 끝나면 돌아간다

    let n = crew.get(m.key);
    if (planners.length) {
      if (!n) { const e = ENTRY(); n = { ...m, npc: true, path: [], x: e.x + i * .5, y: e.y, face: 1, phase: Math.random() * 9, arrived: true }; crew.set(m.key, n); }
      setTarget(n, 'meet', seats[Math.min(seat++, seats.length - 1)]);

    else if (b.state === 'done') setTarget(b, 'brag', b.desk ? { x: b.desk.seat.x + .6, y: b.desk.seat.y + (b.desk.far ? -.1 : .1) } : COMB_SPOT);
    else if (b.deliver) setTarget(b, 'comb', COMB_SPOT);

      setTarget(b, 'lounge', b.spot ? { x: b.spot.x, y: b.spot.y } : { x: 8 + (b.idx % 7), y: 14 + LAY.LOFF + (b.idx % 2) * .6 });
    }
  }
}

const honeyShown = () => Math.max(0, honeyTotal - [...bees.values()].filter(b => b.state === 'done' || b.deliver).length);
function whereOf(b) {
  const aides = b.agents > 0 ? tr(` · 부사수 ${b.agents}명`, ` · ${b.agents} helper${b.agents > 1 ? 's' : ''}`) : '';
  const mates = [...crew.values()].filter(n => n.key2 === 'meet' && n.arrived).length;

  if (b.state === 'run') return (b.plan ? (b.atBoard ? tr('회의실 · 화이트보드에 계획 그리는 중', 'meeting room · drawing the plan on the whiteboard') : tr('회의실 · 계획 회의 중', 'meeting room · planning')) + withMates
    : tr('자리에서 일하는 중', 'working at the desk')) + aides;
  if (b.state === 'wait') { const i = [...bees.values()].filter(x => x.state === 'wait').sort((a, c) => a.at - c.at).indexOf(b); return tr(`사장실 질문 창구 ${i + 1}번째`, `question window, #${i + 1} in line`); }

}

/* ---------- speech ---------- */
function say(b, text, ms = 2200) { b.say = { text, until: performance.now() + ms }; }
setInterval(() => {
  const members = [...bees.values()].filter(b => b.key2 === 'meet' && b.arrived);

  const empty = $('#empty');
  empty.hidden = list.length > 0;
  empty.textContent = tr('지금은 Claude 세션이 없어요. 터미널에서 hm 으로 프로젝트를 열고 Claude 를 시작하면 벌이 출근해요.',
    'No Claude sessions yet. Open a project with hm in a terminal and start Claude; a bee will come to work.');
  const n = st => list.filter(b => b.state === st).length;
  const chips = $('#chips');
  chips.replaceChildren(...[['run'], ['wait'], ['done'], ['idle']].map(([k]) => chip(k === 'idle' ? 'sleep' : k, label(k), n(k), k === 'wait' && n('wait') > 0)),
    chip('honey', tr('오늘 꿀', 'honey today'), honeyTotal, false, tr('칸', '')));
  renderPop();
}
function chip(color, text, num, hot, unit = '') {
  const s = document.createElement('span');
  s.className = 'chip' + (hot ? ' hot' : ''); s.style.setProperty('--c', `var(--${color})`);
  const i = document.createElement('i'), b = document.createElement('b'); b.textContent = num;
  s.append(i, `${text} `, b, unit ? ` ${unit}` : '');
  return s;
}
setInterval(render, 1000);

/* ---------- ui ---------- */
function toast(msg) {
  const el = $('#toast'); el.textContent = msg; el.hidden = false;
  clearTimeout(toast.t); toast.t = setTimeout(() => el.hidden = true, 3000);
}
const panel = $('#settings'), gear = $('#gear');
gear.addEventListener('click', () => { panel.hidden = !panel.hidden; gear.setAttribute('aria-expanded', String(!panel.hidden)); });
document.addEventListener('click', e => { if (!panel.hidden && !panel.contains(e.target) && !gear.contains(e.target)) { panel.hidden = true; gear.setAttribute('aria-expanded', 'false'); } });
for (const k of ['pop', 'privacy', 'sound', 'sky']) { const r = panel.querySelector(`input[name="${k}"][value="${settings[k]}"]`); if (r) r.checked = true; }
panel.addEventListener('submit', e => e.preventDefault());
panel.addEventListener('change', e => {
  if (e.target.id === 'top') return tell({ top: e.target.checked });
  settings[e.target.name] = e.target.value; saveSettings();
  if (e.target.name === 'sound' && e.target.value === 'on') buzz();
  render(); maybePop();
});
if (native) $('#top-set').hidden = false;
window.officeTop = on => { $('#top').checked = !!on; };

applyLang(); readTokens();
addEventListener('resize', resize);
poll();
requestAnimationFrame(frame);
</script>
</body>
