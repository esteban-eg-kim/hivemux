# ~/.tmux.conf -> /Users/esteban/project/claude/tools/ghostty-tumx/tmux/tmux.conf

# --- Prefix: Claude Code uses Ctrl+B for background tasks, so use Ctrl+A ---
set -g prefix C-a
unbind C-b
bind C-a send-prefix

# --- Terminal / Claude Code compatibility ---
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-ghostty:RGB:extkeys:clipboard:sync:hyperlinks"
# Claude Code 는 tmux 안에서 링크 지원을 감지하지 못하므로 켜 둔다 (⌘+클릭으로 열기)
set-environment -g FORCE_HYPERLINK 1
set -as terminal-features ",xterm*:extkeys"
set -s extended-keys on
set -g allow-passthrough all       # notifications from panes not on screen too
set -g focus-events on
set -s set-clipboard on
set -sg escape-time 0
set -g history-limit 100000
set -g mouse on
set -g set-titles on
set -g set-titles-string "#S / #W"

# --- Indexing / windows ---
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
setw -g monitor-bell on
set -g bell-action other

# --- Splits keep current directory ---
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
bind r source-file ~/.tmux.conf \; display "tmux.conf reloaded"

# --- Claude helpers ---
# prefix + c : new window with a shell (current directory)
# prefix + C : ask a name, open a new window and start "claude -n <name>"
bind C run-shell "/Users/esteban/project/claude/tools/ghostty-tumx/bin/claude-win '#{pane_current_path}'"
# prefix + R : Remote Control server window (start new sessions from phone)
bind R run-shell "/Users/esteban/project/claude/tools/ghostty-tumx/bin/claude-rc '#{pane_current_path}'"
# prefix + S : session/window tree
bind S choose-tree -Zw

# --- Status line: Claude state per window (set by hooks) ---
#   ⚙ working   ⏳ needs you   ✓ finished
set -g status-interval 5
# 색 체계는 사이드바(bin/claude-sidebar-view)와 같다
set -g status-style "bg=#16181d,fg=#9aa3b2"
set -g status-left-length 30
set -g status-left "#[bg=#16181d]  #[fg=#e6e9ef,bold]#S#[nobold]  #[fg=#2c3039]│ "
set -g status-right-length 60
# continuum autosave trigger is registered here explicitly: its own startup
# check miscounts tpm's tmux calls as "another server" and silently skips it.
set -g status-right "#(~/.tmux/plugins/tmux-continuum/scripts/continuum_save.sh)#{?client_prefix,#[bg=#f5a524 fg=#16181d bold] PREFIX #[default] ,}#[fg=#626a78]%m-%d  %H:%M  "
set -g window-status-format "#[fg=#626a78] #I #[fg=#9aa3b2]#W#{?#{==:#{@claude_state},run}, #[fg=#5aa9ff]#{?@claude_spin,#{@claude_spin},◐},}#{?#{==:#{@claude_state},wait}, #[fg=#f5a524]●,}#{?#{==:#{@claude_state},done}, #[fg=#3ecf8e]✓,} "
set -g window-status-current-format "#[bg=#2a2f3a,fg=#9aa3b2] #I #[fg=#e6e9ef,bold]#W#[nobold]#{?#{==:#{@claude_state},run}, #[fg=#5aa9ff]#{?@claude_spin,#{@claude_spin},◐},}#{?#{==:#{@claude_state},wait}, #[fg=#f5a524]●,}#{?#{==:#{@claude_state},done}, #[fg=#3ecf8e]✓,} #[default]"

# --- Left sidebar: every Claude in every session (bin/claude-sidebar, claude-sidebar-view) ---
# 각 창 왼쪽에 사이드바 칸. 프로젝트별로 묶어 작업마다 색 타일.
#  주황 = 입력 필요, 파랑 = 작업 중, 초록 = 완료(안 봄), 회색 = 대기, 흰 타일 + ▶ = 지금 보는 작업
set -g status on
set -gu status-format
set -g status-position top
set -g status-interval 5
# 자동 창 이름: 초점이 사이드바에 있어도 창 이름을 Python 으로 바꾸지 않는다
set -g automatic-rename-format "#{?#{==:#{pane_title},claude-sidebar},#{window_name},#{?pane_in_mode,[tmux],#{pane_current_command}}#{?pane_dead,[dead],}}"
# 사이드바 폭: 경계선을 끌어 바꾸면 ~/.local/share/tmux/claude-sidebar-width 에 저장된다.
# 저장값이 있으면 그것을, 없으면 32 칸 (설정을 다시 읽어도 끌어서 바꾼 폭이 유지됨)
run-shell 'w=$(cat "${XDG_DATA_HOME:-$HOME/.local/share}/tmux/claude-sidebar-width" 2>/dev/null); tmux set -g @sidebar-width "${w:-32}"'
# 작업 중 애니메이션(빛 띠, 맥박, 스피너, 입력 필요 깜빡임). 끄려면 off
set -g @sidebar-anim on
set-hook -g after-new-window  'run-shell -b "/Users/esteban/project/claude/tools/ghostty-tumx/bin/claude-sidebar ensure #{window_id}"'
set-hook -g after-new-session 'run-shell -b "/Users/esteban/project/claude/tools/ghostty-tumx/bin/claude-sidebar ensure #{window_id}"'
set-hook -g pane-exited       'run-shell -b "/Users/esteban/project/claude/tools/ghostty-tumx/bin/claude-sidebar reap"'
set-hook -g after-kill-pane   'run-shell -b "/Users/esteban/project/claude/tools/ghostty-tumx/bin/claude-sidebar reap"'
set-hook -g window-resized    'run-shell -b "/Users/esteban/project/claude/tools/ghostty-tumx/bin/claude-sidebar fix"'
set-hook -g client-attached   'run-shell -b "/Users/esteban/project/claude/tools/ghostty-tumx/bin/claude-sidebar fix"'
run-shell -b "/Users/esteban/project/claude/tools/ghostty-tumx/bin/claude-sidebar ensure"
# Option+O : 지금 칸의 최근 출력에서 파일 경로를 골라 열기 (VS Code, 줄 번호 포함)
bind -n M-o run-shell -b "/Users/esteban/project/claude/tools/ghostty-tumx/bin/claude-open '#{pane_id}' '#{client_name}'"
# 칸 경계선 끌기: 누르는 동안 포인터를 크기 조절 모양으로 + 경계선 강조, 놓으면 사이드바 폭 저장
# (tmux 는 마우스 이동 이벤트가 없어 "올려 놓기"만으로는 바꿀 수 없다)
bind -n MouseDown1Border select-pane -M \; run-shell -b "/Users/esteban/project/claude/tools/ghostty-tumx/bin/claude-border down '#{client_tty}'"
bind -n MouseDrag1Border resize-pane -M
bind -n MouseDragEnd1Border run-shell -b "/Users/esteban/project/claude/tools/ghostty-tumx/bin/claude-border up '#{client_tty}' '#{window_id}'"
bind -n MouseUp1Border run-shell -b "/Users/esteban/project/claude/tools/ghostty-tumx/bin/claude-border up '#{client_tty}' '#{window_id}'"
# 사이드바 오른쪽 끝 칸(⋮ 핸들)에서 시작한 끌기도 폭 조절로. 그 밖은 tmux 기본 동작 그대로
# (끌기 도중의 이동은 tmux 가 resize-pane -M 으로 계속 처리하므로 시작 판정만 하면 된다)
bind -n MouseDown1Pane if -F '#{&&:#{==:#{pane_title},claude-sidebar},#{==:#{mouse_x},#{e|-:#{pane_width},1}}}' \
  "set -g @grip_drag 1 ; run-shell -b \"/Users/esteban/project/claude/tools/ghostty-tumx/bin/claude-border down '#{client_tty}'\"" \
  "select-pane -t = ; send-keys -M"
bind -n MouseDrag1Pane if -F '#{@grip_drag}' "resize-pane -M" \
  "if-shell -F '#{||:#{pane_in_mode},#{mouse_any_flag}}' 'send-keys -M' 'copy-mode -M'"
bind -n MouseDragEnd1Pane if -F '#{@grip_drag}' \
  "set -gu @grip_drag ; run-shell -b \"/Users/esteban/project/claude/tools/ghostty-tumx/bin/claude-border up '#{client_tty}' '#{window_id}'\"" "send-keys -M"
bind -n MouseUp1Pane if -F '#{@grip_drag}' \
  "set -gu @grip_drag ; run-shell -b \"/Users/esteban/project/claude/tools/ghostty-tumx/bin/claude-border up '#{client_tty}' '#{window_id}'\"" "send-keys -M"
# prefix + b : 사이드바 모두 숨기기 / 다시 보기
bind b run-shell -b "/Users/esteban/project/claude/tools/ghostty-tumx/bin/claude-sidebar toggle"
bind -n MouseDown1Status select-window -t =

# Option+1..9 : N번 Claude로 바로 이동 (세션이 달라도)
# Option+0    : 가장 오래 기다린 Claude로 이동 (없으면 끝난 것)
bind -n M-1 run-shell -b "/Users/esteban/project/claude/tools/ghostty-tumx/bin/claude-agents jump 1 '#{client_name}'"
bind -n M-2 run-shell -b "/Users/esteban/project/claude/tools/ghostty-tumx/bin/claude-agents jump 2 '#{client_name}'"
bind -n M-3 run-shell -b "/Users/esteban/project/claude/tools/ghostty-tumx/bin/claude-agents jump 3 '#{client_name}'"
bind -n M-4 run-shell -b "/Users/esteban/project/claude/tools/ghostty-tumx/bin/claude-agents jump 4 '#{client_name}'"
bind -n M-5 run-shell -b "/Users/esteban/project/claude/tools/ghostty-tumx/bin/claude-agents jump 5 '#{client_name}'"
bind -n M-6 run-shell -b "/Users/esteban/project/claude/tools/ghostty-tumx/bin/claude-agents jump 6 '#{client_name}'"
bind -n M-7 run-shell -b "/Users/esteban/project/claude/tools/ghostty-tumx/bin/claude-agents jump 7 '#{client_name}'"
bind -n M-8 run-shell -b "/Users/esteban/project/claude/tools/ghostty-tumx/bin/claude-agents jump 8 '#{client_name}'"
bind -n M-9 run-shell -b "/Users/esteban/project/claude/tools/ghostty-tumx/bin/claude-agents jump 9 '#{client_name}'"
bind -n M-0 run-shell -b "/Users/esteban/project/claude/tools/ghostty-tumx/bin/claude-agents next '#{client_name}'"
bind Space run-shell -b "/Users/esteban/project/claude/tools/ghostty-tumx/bin/claude-agents next '#{client_name}'"

# 칸 경계선을 바탕에 가깝게 (사이드바 경계가 튀지 않게)
set -g pane-border-style "fg=#23262e"
set -g pane-active-border-style "fg=#2c3039"
set -g pane-border-lines single
set -g window-status-separator ""
set -g message-style "bg=#2a2f3a,fg=#e6e9ef"
set -g mode-style "bg=#2a2f3a,fg=#e6e9ef"

# --- Persistence: resurrect + continuum ---
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-save-interval '5'
# Restore is done by bin/tmx at server start (deterministic, waits for it).
set -g @continuum-restore 'off'
# Map tmux panes <-> Claude session ids on every save, resume them after restore
set -g @resurrect-hook-post-save-all '/Users/esteban/project/claude/tools/ghostty-tumx/bin/claude-panes save'
# 복원 중에는 사이드바 자동 생성을 멈춘다 (칸 배치/번호가 저장본과 같아야 Claude 재개 매핑이 맞음)
set -g @resurrect-hook-pre-restore-all 'tmux set -g @sidebar-suspend 1'
set -g @resurrect-hook-post-restore-all '/Users/esteban/project/claude/tools/ghostty-tumx/bin/claude-panes restore; tmux set -gu @sidebar-suspend; /Users/esteban/project/claude/tools/ghostty-tumx/bin/claude-sidebar rebuild'

# First autosave only after one interval, so a fresh server never overwrites
# the saved state before it has been restored.
run-shell 'tmux show -gqv @continuum-save-last-timestamp | grep -q . || tmux set -g @continuum-save-last-timestamp "$(date +%s)"'

# Keep this last (continuum hooks into status-right)
run '~/.tmux/plugins/tpm/tpm'
